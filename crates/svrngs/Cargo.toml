[package]
name = "svrngs"
version.workspace = true
# Upstream's edition, so the forked identity.rs and link.rs land unchanged
# (ARCH 2).
edition = "2021"
license.workspace = true
description = "The svrngs command: a computer's device key, a group's link, and the verbs that make a group, mint its link and run the node. The device key is forked from commonwealth-ai's commonwealth-transport identity.rs, the link from mesh-join-vocab's deep_link.rs."

[dependencies]
svrngs-node = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.3"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# join_by_link.rs dials as a stranger, as svrngs-node's own tests do.
reqwest = { version = "0.12", default-features = false }
svrngs-core = { workspace = true, features = ["test-support"] }

# Upstream's posture, as svrngs-core and svrngs-node carry it.
[lints.clippy]
empty_line_after_doc_comments = "allow"
cloned_ref_to_slice_refs = "allow"
explicit_auto_deref = "allow"
useless_vec = "allow"

[package]
name = "svrngs"
version.workspace = true
# Upstream's edition, so the forked identity.rs and link.rs land unchanged
# (ARCH 2).
edition = "2021"
license.workspace = true
description = "The svrngs command: a computer's device key, a group's link, and the verbs that make a group, mint its link and run the node. The device key is forked from commonwealth-ai's commonwealth-transport identity.rs; the link's token is svrngs-core's, and the command draws its secret."

[dependencies]
svrngs-node = { workspace = true }
base64 = "0.22"
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.3"
hex = { workspace = true }
# `new --origin` asks the page's host for the page at a name nobody made
# (u5-10), and `share --folder` the node running here (gf-1): the reqwest,
# rustls and verifier iroh's tree already builds.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# join_by_link.rs dials as a stranger, as svrngs-node's own tests do.
reqwest = { version = "0.12", default-features = false }
svrngs-core = { workspace = true, features = ["test-support"] }
# join_page.rs drives a phone's page (web/tests/join.mjs) through a relay on
# 127.0.0.1, as svrngs-node's browser tests do, whose harness it includes.
iroh-relay = { version = "=1.0.2", features = ["server"] }
tokio = { version = "1", features = ["process", "io-util", "net"] }

# Upstream's posture, as svrngs-core and svrngs-node carry it.
[lints.clippy]
empty_line_after_doc_comments = "allow"
cloned_ref_to_slice_refs = "allow"
explicit_auto_deref = "allow"
useless_vec = "allow"

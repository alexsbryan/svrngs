[package]
name = "svrngs-node"
version.workspace = true
# Upstream's edition, so the fork lands unchanged (ARCH 2).
edition = "2021"
license.workspace = true
description = "A group's journal on disk: one append-only JSONL log per group, the single-writer door that signs and the peer-ingest path that does not; and sync's transport over iroh: the dialling bridge, and the accept loop that serves a router on each admitted stream; and the node that runs the round and the sync route. Forked from commonwealth-ai's commonwealth-rail, with its oplog writer inlined, and its dial-by-key tunnel."

[dependencies]
svrngs-core = { workspace = true }
# The community profile decides who may use a lend and what an app may write.
eudoxia-community = { git = "https://github.com/alexsbryan/eudoxia", rev = "560b0c27b14891111bc46c01e461a0fdb6f48377" }
svrngs-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# A link's token, drawn and keyed where the command drew it (invite.rs,
# moved from svrngs's issuer.rs, start-home): the crates the lock already holds.
ed25519-dalek = { workspace = true }
getrandom = "0.3"
# The dialling half (U1): upstream's requirements at e1a43bcd2. iroh is pinned
# to the version the relay queue chose (relay-survey:
# demo/runs/relay-commons/SURVEY.md, "The chosen versions"), whose relay fixes
# and `Status::RateLimited` the queue's rows need; scripts/advisories.py checks
# both workspaces. `unstable-custom-transports` is the WebRTC path's slot
# (webrtc-node; iroh-1.4.2 src/socket/transports/custom.rs).
iroh = { version = "=1.4.2", features = ["unstable-custom-transports"] }
# The carrier's custom address and its datagram meta, as iroh's own traits
# spell them (webrtc-node; `webrtc/carrier.rs`): iroh-base and the two n0
# crates iroh 1.4.2 resolves, so no new crate joins the lock.
iroh-base = "=1.4.2"
n0-watcher = "=1.0.0"
noq-udp = "=1.4.1"
# The node's WebRTC half (webrtc-node): the str0m peer that answers a
# page's offer, rust-crypto as the relay-survey resolved it (its
# curve25519-dalek 5.0.0 agrees with iroh 1.4.2's).
str0m = { version = "=0.25.0", default-features = false, features = ["rust-crypto"] }
# The stream an address lookup answers with, as iroh names it (src/relay.rs):
# iroh's own, at the version the lock already holds.
n0-future = "0.3"
# The room's network (room.rs `look`): the default route's interface, its
# addresses and its router's, at the version room.rs was written against.
# iroh 1.4.2's netwatch brings its own netdev 0.47.0 beside this one, so the
# lock holds both; this pin does not move with iroh's.
netdev = "=0.45.0"
# A synced directory's changes as the OS reports them (FSEvents, inotify),
# so a step looks only at what changed (perf-2 f; the operator's yes,
# 2026-10-10, ralph/next/syp/CHARTER.md).
notify = "=8.2.0"
# Incoming file operations are relative to an opened root, not joined ambient paths.
cap-std = "3"
# A node's folders' tasks ended with it (node.rs `Stop`): tokio's
# cancellation token, at the version the lock already holds through iroh.
tokio-util = "0.7"
# `signal`: a node stopped by SIGTERM closes its endpoint (syp-6 b).
tokio = { version = "1", features = ["net", "rt", "sync", "time", "io-util", "macros", "signal", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hex = { workspace = true }
rand = "0.9"
# The lender's sign-in key: ES256 through `ring`, already in the lock
# through rustls (SIGN_IN_WITH_SVRNGS §8 3); and base64url for the JWKS'
# x and y. Neither is a new crate here.
ring = "0.17"
base64 = "0.22"
# The one HTTP client the command's page check and the update share
# (http.rs): iroh's reqwest 0.13 and the platform verifier the command
# already used, both already in the lock.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls-platform-verifier = "0.7"
# The authorize ask's query, read and its `state` written back: the lock
# already holds `form_urlencoded` through axum's `Query` and `url`, so this
# names one home rather than a new crate (front.rs).
form_urlencoded = "1"
# The serving half (U1): hyper serves the caller's axum Router on each
# accepted iroh stream; tower's `oneshot` calls the router per request.
axum = "0.8"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The door holds who is using a lend for as long as the answer streams: the
# answer's body carries the hold, and drops it with itself (`map_frame`).
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# The member door (U3) is hyper's HTTP/1 client to a lend's service, one
# connection per request, so nothing between member and service is pooled,
# retried or rewritten but what the door names ("client"); and to a member,
# a request on a bi-stream of the iroh connection (arch-peer).
# A group's folders (gf-1, sy-1): the store, its provider and verified range
# fetch, without the rpc default, over the lock's iroh 1.4.2. 0.104.0 is the
# newest that keeps irpc 0.17.0 (0.105.0 needs irpc 1.0.0; relay-survey,
# "Why iroh-blobs 0.104.0 and not 0.105.0").
iroh-blobs = { version = "=0.104.0", default-features = false, features = ["fs-store"] }
irpc = { version = "=0.17.0", default-features = false }
# The day a computer's person left a group, said by its old lend addresses
# in this computer's time as the command says one (origin.rs `cut_from`,
# #182), and read back by the home page's browser test (home.rs `WHEN`):
# the chrono and clock the command's already takes from the lock.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# An invitation's QR code, for the home page to draw (publication.rs `qr`):
# Nayuki's reference encoder, MIT, with no dependency of its own, where a
# vendored JavaScript one would be counted against the page's budget.
qrcodegen = "=1.8.0"

# libproc's read of this account's sockets (uid.rs `kernel`), svrngs's one
# `unsafe` function, through the libc the lock already holds.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# sock_diag's dump of a share's port (uid.rs `diag`), its answer parsed in
# safe Rust: the netlink socket the lock already holds through the room's
# netdev 0.45.0 (iroh 1.4.2's netwatch holds 0.9.0 beside it).
[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = "=0.8.8"

[features]
# What only a test asks of a node (src/node/tests_support.rs): its routes as a
# caller no socket can be, its transport, a round now.
test-support = []

[dev-dependencies]
# The browser tests' relay front ends a page's TLS (tests/browser/harness.rs
# `relay`): rustls with ring, as the product uses it, and a certificate made
# there, both already in the lock through iroh-relay.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.14"
svrngs-core = { workspace = true, features = ["test-support"] }
# This crate's integration tests (tests/) link it as any caller does, so they
# turn its test support on here.
svrngs-node = { path = ".", features = ["test-support"] }
tempfile = "3"
# The tests' own HTTP client, to a node's record API and through a splice
# (src/node/tests_support.rs); the product asks on the stream (arch-peer).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# The folders' tests (tests/folders.rs) hash and fill files with BLAKE3.
blake3 = { workspace = true }
tokio = { version = "1", features = ["full"] }
# The door's tests check a file's bytes through it sha-exact.
sha2 = "0.10"
# The browser tests (tests/browser) run a relay on 127.0.0.1, plain HTTP, so
# a page in a headless browser reaches a node with nothing from the
# internet: iroh's own relay server, at the version iroh =1.4.2 resolves.
iroh-relay = { version = "=1.4.2", features = ["server"] }
# The conformance canary keeps the door's `carriage` lines beside what the
# browser saw (u5-11): the subscriber the command itself uses.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The scale instrument (tests/scale.rs) reads its own processor time with
# `getrusage`, which std does not offer; libc is already in the lock.
libc = "0.2"

[lints.clippy]
empty_line_after_doc_comments = "allow"
cloned_ref_to_slice_refs = "allow"
explicit_auto_deref = "allow"
useless_vec = "allow"
# Upstream's workspace allowance (commonwealth-ai Cargo.toml:312 at
# e1a43bcd2), kept for rail.rs's doors, which refuse with a `Response`.
result_large_err = "allow"

# Run once each, by name, in scripts/check.sh's own steps: a plain `cargo
# test` skips them, so the gate does not run them twice.
[[test]]
name = "canaries"
test = false

[[test]]
name = "browser"
test = false

[[test]]
name = "conformance"
test = false

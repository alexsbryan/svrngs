<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" role="img" aria-labelledby="t d">
<title id="t">svrngs: if it runs on localhost, your friends can use it</title>
<desc id="d">Ana lends an app on a port. Her computer’s door takes off any identity a request claims, adds the verified person, injects the app’s secret, keeps to her limits and cuts off anyone removed. Ben opens it in his browser or plays a game at 127.0.0.1; Cy opens it on a phone at its own address. An app gets three things: who is asking, a record the group keeps, and reach to every computer.</desc>
<rect x="0" y="0" width="1200" height="930" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="927" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="112" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="start" fill="black">If it runs on localhost, your friends can use it.</text><text x="50" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="black">Lend any app on a port to your group. No login, no SDK, no bundle, no port opened.</text><text x="1152" y="56" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="end" fill="black">2 / 3</text><rect x="40" y="172" width="500" height="420" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="172" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s computer</text><rect x="56" y="226" width="184" height="170" fill="plum" stroke="black" stroke-width="3"/><text x="68" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">anything on a port</text><text x="68" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">Jellyfin</text><text x="230" y="282" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" fill="black">:8096</text><text x="68" y="308" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">llama-server</text><text x="230" y="308" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" fill="black">:8080</text><text x="68" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">a dev server</text><text x="230" y="334" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" fill="black">:5173</text><text x="68" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">Minecraft</text><text x="230" y="360" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" fill="black">:25565/udp</text><line x1="258" y1="312" x2="253" y2="312" stroke="black" stroke-width="3"/><path d="M242 312 L253.0 306.5 L253.0 317.5 Z" fill="black"/><text x="56" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Ana presses Share on her</text><text x="56" y="443.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">home page.</text><text x="56" y="572" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" fill="black">or: svrngs share 8096 --kind jellyfin</text><rect x="258" y="214" width="262" height="334" fill="white" stroke="black" stroke-width="5"/><text x="274" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" fill="black">the door</text><path d="M275 269 L279.9 274.25 L289 263.4" fill="none" stroke="black" stroke-width="3.2"/><text x="298" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">takes off any “who I am” the</text><text x="298" y="292.2" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">request claims</text><path d="M275 317.2 L279.9 322.45 L289 311.59999999999997" fill="none" stroke="black" stroke-width="3.2"/><text x="298" y="322.2" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">adds who is asking, verified:</text><text x="298" y="340.2" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="black">X-Svrngs-Key, -Person, -User</text><path d="M275 365.2 L279.9 370.45 L289 359.59999999999997" fill="none" stroke="black" stroke-width="3.2"/><text x="298" y="370.2" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">puts in the app’s own secret,</text><text x="298" y="388.4" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">which never leaves</text><path d="M275 413.4 L279.9 418.65 L289 407.79999999999995" fill="none" stroke="black" stroke-width="3.2"/><text x="298" y="418.4" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">keeps to Ana’s choices: which</text><text x="298" y="436.59999999999997" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">paths, how many people</text><path d="M276 455.59999999999997 L288 467.59999999999997 M288 455.59999999999997 L276 467.59999999999997" fill="none" stroke="tomato" stroke-width="3.2"/><text x="298" y="466.59999999999997" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">cuts off anyone removed from</text><text x="298" y="484.79999999999995" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the group within seconds</text><rect x="540" y="326" width="150" height="28" fill="skyblue" stroke="black" stroke-width="3"/><line x1="556" y1="340" x2="535" y2="340" stroke="black" stroke-width="3"/><path d="M524 340 L535.0 334.5 L535.0 345.5 Z" fill="black"/><text x="615" y="314" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" fill="black">over iroh</text><text x="548" y="380" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">encrypted end to</text><text x="548" y="395.6" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">end; nothing to</text><text x="548" y="411.2" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">open, nothing to</text><text x="548" y="426.8" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">install</text><line x1="690" y1="340" x2="735" y2="262" stroke="black" stroke-width="3"/><line x1="690" y1="340" x2="735" y2="480" stroke="black" stroke-width="3"/><rect x="735" y="172" width="425" height="200" fill="white" stroke="black" stroke-width="3"/><rect x="735" y="172" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="748" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ben’s computer</text><rect x="755" y="222" width="385" height="30" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="765" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" fill="black">http://jellyfin-3f9a….localhost:&lt;port&gt;/</text><text x="755" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Opens in his browser like his own app, already</text><text x="755" y="299.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">signed in as Ben.</text><rect x="755" y="318" width="62" height="30" fill="yellow" stroke="black" stroke-width="3"/><text x="786" y="339" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="black">Play</text><text x="830" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">A game connects to</text><text x="830" y="348" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" fill="black">127.0.0.1:25565, as if it ran here.</text><rect x="735" y="392" width="425" height="200" fill="white" stroke="black" stroke-width="3"/><rect x="735" y="392" width="113" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="748" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Cy’s phone</text><rect x="757" y="442" width="44" height="79" fill="white" stroke="black" stroke-width="3"/><line x1="772.4" y1="513" x2="785.6" y2="513" stroke="black" stroke-width="3"/><rect x="763" y="452" width="32" height="40" fill="plum" stroke="black" stroke-width="2"/><text x="818" y="456" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Opens from the group’s page, each app at</text><text x="818" y="475.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">an address of its own.</text><text x="818" y="512" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">https://&lt;label&gt;.group.svrnme.sh/ · a worker</text><text x="818" y="527.6" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">holds a pass; the page that holds Cy’s key</text><text x="818" y="543.2" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">never runs an app</text><line x1="24" y1="626" x2="1176" y2="626" stroke="black" stroke-width="3"/><text x="40" y="658" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Your app gets three things, and needs nothing else</text><rect x="40" y="676" width="360" height="124" fill="plum" stroke="black" stroke-width="3"/><text x="54" y="704" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Who’s asking, verified</text><text x="54" y="728" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">In the request’s headers. Key on</text><text x="54" y="747.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">X-Svrngs-Key; show X-Svrngs-Person.</text><text x="54" y="769.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">the door strips any a client sent</text><rect x="420" y="676" width="360" height="124" fill="plum" stroke="black" stroke-width="3"/><text x="434" y="704" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">A record the group keeps</text><text x="434" y="728" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">It outlives the computer the app runs on,</text><text x="434" y="747.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">and every copy reads the same.</text><text x="434" y="769.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">GET, POST /svrngs/acts · or name acts in</text><text x="434" y="785.1" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">x-svrngs-append</text><rect x="800" y="676" width="360" height="124" fill="plum" stroke="black" stroke-width="3"/><text x="814" y="704" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Reach to every computer</text><text x="814" y="728" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Lent, an app goes with its lender. Carried,</text><text x="814" y="747.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">it is a folder the group keeps, and opens on</text><text x="814" y="767" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">any computer that is on.</text><text x="814" y="789" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">apps/&lt;kind&gt;/index.html</text><text x="40" y="828" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">What can act as you is said by what it can do (know who you are, reach an app as you, read or write the record, decide for you), never by what kind</text><text x="40" y="847.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">of app it is. We build the rails and small examples to copy and bend; the finished apps are yours.</text><line x1="24" y1="866" x2="1176" y2="866" stroke="black" stroke-width="3"/><text x="40" y="898" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">NORTH_STAR 2 · no login, no SDK, no bundle</text><text x="1105" y="898" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="885" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="898" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="885" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="898" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="885" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="898" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="885" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="898" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="885" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="898" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="885" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>
</svg>

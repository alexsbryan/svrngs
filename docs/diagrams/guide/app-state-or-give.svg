<title id="t">What does your group keep? A shared board or a running game</title>
<desc id="d">With planned shared app data, Jo and Sam can each save a Magnets move on their own computer. Their board copies merge edits when the computers reconnect. With Give, Factorio runs on Jo’s computer. Sam has a saved copy and can take over from it.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">The pantry: every friend’s model behind one address</title>
<desc id="d">On your computer, a chat app points at the pantry, at 127.0.0.1:8787/v1, which adds your svrngs token. Its model list shows Ana/coder and Sam/voice; picking Ana/coder sends the chat to Ana’s computer. A friend’s tools, such as Bo’s, are reached at their own address from pantry.mjs list with /mcp on the end.</desc>
<rect x="0" y="0" width="1200" height="580" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="577" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="96" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="900" text-anchor="start" fill="black">Every friend’s model, one address.</text><text x="50" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="black">The pantry sends each chat to the friend whose model it names.</text><text x="1152" y="52" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="end" fill="black">guide/models</text><rect x="40" y="150" width="520" height="290" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="150" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Your computer</text><rect x="60" y="200" width="210" height="110" fill="plum" stroke="black" stroke-width="3"/><text x="74" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">chat app</text><text x="74" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">model:</text><text x="74" y="282" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">Ana/coder</text><line x1="270" y1="255" x2="317" y2="255" stroke="black" stroke-width="3"/><path d="M328 255 L317.0 260.5 L317.0 249.5 Z" fill="black"/><rect x="330" y="200" width="210" height="110" fill="white" stroke="black" stroke-width="5"/><text x="346" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">the pantry</text><text x="346" y="256" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">127.0.0.1:8787/v1</text><text x="346" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">adds your token</text><text x="60" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Tools: each at its own address,</text><text x="60" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">from</text><text x="98" y="402" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">pantry.mjs list</text><text x="240" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">+</text><text x="256" y="402" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">/mcp</text><line x1="540" y1="255" x2="760" y2="190" stroke="black" stroke-width="3"/><line x1="540" y1="255" x2="760" y2="290" stroke="black" stroke-width="3"/><line x1="320" y1="390" x2="760" y2="390" stroke="black" stroke-width="3" stroke-dasharray="8 6"/><rect x="760" y="150" width="400" height="80" fill="white" stroke="black" stroke-width="3"/><rect x="760" y="150" width="157" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="773" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-s
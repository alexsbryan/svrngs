ystem, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">before either sees the other’s</text><line x1="372" y1="188" x2="459.3998117516608" y2="234.3754103172078" stroke="black" stroke-width="3"/><path d="M470 240 L456.6 239.7 L462.2 229.1 Z" fill="black"/><line x1="372" y1="330" x2="459.3998117516608" y2="283.6245896827922" stroke="black" stroke-width="3"/><path d="M470 278 L462.2 288.9 L456.6 278.3 Z" fill="black"/><rect x="476" y="116" width="584" height="288" fill="white" stroke="black" stroke-width="3"/><rect x="476" y="116" width="283" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="489" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s, Bo’s and Cy’s computers</text><rect x="528" y="168" width="70" height="42" fill="white" stroke="black" stroke-width="3"/><line x1="521" y1="216" x2="605" y2="216" stroke="black" stroke-width="4"/><rect x="638" y="168" width="70" height="42" fill="white" stroke="black" stroke-width="3"/><line x1="631" y1="216" x2="715" y2="216" stroke="black" stroke-width="4"/><rect x="748" y="168" width="70" height="42" fill="white" stroke="black" stroke-width="3"/><line x1="741" y1="216" x2="825" y2="216" stroke="black" stroke-width="4"/><rect x="500" y="248" width="300" height="40" fill="white" stroke="black" stroke-width="2"/><text x="512" y="274" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">setlist.txt</text><text x="816" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Bo’s edit</text><rect x="500" y="300" width="300" height="40" fill="white" stroke="black" stroke-width="2"/><text x="512" y="326" font-family="ui-monospace, 'SF Mono', SFMono-Regula
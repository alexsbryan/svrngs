<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d">
<title id="t">Two edits at once: both are kept</title>
<desc id="d">Bo and Cy both edit setlist.txt before either sees the other’s change. Every computer ends with setlist.txt and setlist (conflict Cy).txt, named after whoever wrote it. Open both, merge by hand, and delete the one you don’t need.</desc>

troke="black" stroke-width="2"/><text x="921" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="901" y="495" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="795" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="775" y="495" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="725" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="705" y="495" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="613" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="593" y="495" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="529" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="509" y="495" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>

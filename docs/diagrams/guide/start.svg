th="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="595" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="595" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="595" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="595" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="595" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people<
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Start: one line, one group, one link</title>
<desc id="d">Sam pastes one line in Terminal; the home page opens, Sam makes Lab and presses Invite someone to Lab, and the link goes in the chat. Bo opens it on a computer with one line in Terminal; Ana opens it on a phone, types Ana and presses Join. Sam’s and Bo’s computers keep Lab, each with its folder; Ana’s phone opens it while a computer in Lab is on.</desc>
<rect x="0" y="0" width="1200" height="640" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="637" fill="none" stroke="black" stroke-width="3"/>

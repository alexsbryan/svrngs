y="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Lab</text><rect x="156" y="320" width="70" height="32" fill="salmon" stroke="black" stroke-width="2"/><text x="191" y="342" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Sam</text><rect x="76" y="372" width="212" height="34" fill="yellow" stroke="black" stroke-width="3"/><text x="182" y="395" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Invite someone to Lab</text><rect x="60" y="446" width="350" height="40" fill="gold" stroke="black" stroke-width="2"/><text x="74" y="472" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">keeps Lab</text><text x="170" y="472" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">~/svrngs/Lab</text><text x="470" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">The link goes in the chat.</text><rect x="470" y="276" width="250" height="84" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="486" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">sam: come join Lab</text><text x="486" y="338" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="blue" text-decoration="underline">group.svrnme.sh/#…</text><line x1="300" y1="389" x2="455.63520050695104" y2="333.6838745186138" stroke="black" stroke-width="2.5"/><path d="M466 330 L457.5 338.9 L453.8 328.5 Z" fill="black"/><line x1="720" y1="300" x2="768.0817127503725" y2="253.63549127642656" stroke="black" stroke-width="2.5"/><path d="M776 246 L771.9 257.6 L764.3 249.7 Z" fill="black"/><line x1="720" y1="340" x2="768.7564493134463" y2="395.7216563582243" stroke="black" stroke-width="2.5"/><path d="M776 404 L764.6 399.3 L772.9 392.1 Z" fill="black"/><rect x="780" y="150" width="380" height="160" fill="white" stroke="black" stroke-width="3"/><rect x="780" y="150" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="793" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo’s computer</text><text x="800" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">One line in Terminal.</text><rect x="800" y="218" width="340" height="34" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="812" y="241" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">$ curl … '&lt;the link&gt;'</text><rect x="800" y="262" width="340" height="36" fill="gold" stroke="black" stroke-width="2"/><text x="814" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">keeps Lab</text><text x="910" y="286" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">~/svrngs/Lab</text><rect x="780" y="330" width="380" height="175" fill="white" stroke="black" stroke-width="3"/><rect x="780" y="330" width="129" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="793" y="353" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-wei
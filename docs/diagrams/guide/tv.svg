<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">The room: your WiFi opens a lend as you</title>
<desc id="d">Cy presses Open it to this WiFi. A TV, a laptop and a phone on the home WiFi type http://192.168.1.4:48719/ and reach Cy’s computer, which opens Sam’s Jellyfin for them as Cy. When Cy’s computer is on another WiFi, it is closed for now.</desc>

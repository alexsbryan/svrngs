<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">A program on your computer calls a friend’s model</title>
<desc id="d">A program on Bo’s computer calls the address Bo copied, a name ending in .localhost, with the token from ~/.svrngs/token as its API key. Bo’s svrngs checks the token and asks Sam’s computer as Bo; the token goes no further. Sam’s computer checks it is Bo, adds Sam’s own key if llama-server has one, and passes the request to llama-server.</desc>
<rect x="0" y="0" width="1200" height="580" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="577" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="96" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="900" text-anchor="start" fill="black">Your program calls a friend’s model.</text><text x="50" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="black">Through your svrngs, then Sam’s computer, to llama-server.</text><text x="1152" y="52" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="end" fill="black">guide/models</text><rect x="40" y="150" width="560" height="290" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="150" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo’s computer</text><rect x="60" y="200" width="260" height="220" fill="plum" stroke="black" stroke-width="3"/><text x="74" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">a program</text><text x="74" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">chat app, editor, script</text><text x="74" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="black">base URL</text><text x="74" y="314" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">http://….localhost:…/v1</text><text x="74" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="black">API key</text><rect x="70" y="362" width="180" height="32" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="80" y="384" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">~/.svrngs/token</text><line x1="320" y1="300" x2="367" y2="300" stroke="black" stroke-width="3"/><path d="M378 300 L367.0 305.5 L367.0 294.5 Z" fill="black"/><rect x="380" y="200" width="200" height="220" fill="white" stroke="black" stroke-width="5"/><text x="396" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" fill="black">svrngs</text><path d="M395 271 L399.9 276.25 L409 265.4" fill="none" stroke="black" stroke-width="3.2"/><text x="420" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">token checked</text><rect x="392" y="315.38" width="152.16" height="20.06" fill="yellow" stroke="none" stroke-width="0"/><text x="396" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">token stops here</text><text x="396" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">asks as Bo</text><rect x="680" y="150" width="480" height="290" fill="white" stroke="black" stroke-width="3"/><rect x="680" y="150" width="157" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="693" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Sam’s computer</text><rect x="600" y="296" width="80" height="28" fill="skyblue" stroke="black" stroke-width="3"/><line x1="582" y1="310" x2="707" y2="310" stroke="black" stroke-width="3"/><path d="M718 310 L707.0 315.5 L707.0 304.5 Z" fill="black"/><rect x="720" y="200" width="200" height="220" fill="white" stroke="black" stroke-width="5"/><text x="736" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" fill="black">svrngs</text><path d="M735 271 L739.9 276.25 L749 265.4" fill="none" stroke="black" stroke-width="3.2"/><text x="760" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">checks it’s Bo</text><path d="M735 315 L739.9 320.25 L749 309.4" fill="none" stroke="black" stroke-width="3.2"/><text x="760" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">adds Sam’s own</text><text x="760" y="340.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">key, if any</text><line x1="920" y1="270" x2="947" y2="270" stroke="black" stroke-width="3"/><path d="M958 270 L947.0 275.5 L947.0 264.5 Z" fill="black"/><rect x="960" y="200" width="180" height="140" fill="plum" stroke="black" stroke-width="3"/><text x="974" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">llama-server</text><text x="974" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Sam’s coder</text><text x="974" y="282" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">:8101</text><rect x="36" y="470.8" width="612.2" height="23.599999999999998" fill="yellow" stroke="none" stroke-width="0"/><text x="40" y="488" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="black">Your token stops at your computer. Sam never receives it.</text><line x1="24" y1="516" x2="1176" y2="516" stroke="black" stroke-width="3"/><g transform="translate(53 543.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="535" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="535" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="535" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="535" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="535" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="535" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>
</svg>

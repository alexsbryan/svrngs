<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d">
<title id="t">Two shapes: a lent server, or a carried folder</title>
<desc id="d">A lent server runs on Ana’s computer at 127.0.0.1:4400, lent with svrngs share 4400 --kind hello; it goes with Ana and opens while Ana’s computer is on. A carried app is a folder apps/guestbook/ with index.html and index.js in Elm’s folder, reading and writing the record at svrngs/acts; every computer in Elm serves it, so it opens while any of them is on.</desc>
<rect x="0" y="0" width="1100" height="600" fill="white"/>
<rect x="1.5" y="1.5" width="1097" height="597" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1052" height="64" fill="salmon" stroke="black" stroke-width="3"/><text x="46" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="start" fill="black">Two shapes: a lent server, or a carried folder.</text><line x1="40" y1="120" x2="510" y2="120" stroke="black" stroke-width="3"/><text x="40" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">1</text><text x="66" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Lent: a server on a port</text><rect x="40" y="172" width="470" height="200" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="172" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s computer</text><rect x="60" y="222" width="250" height="76" fill="plum" stroke="black" stroke-width="3"/><text x="76" y="252" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">node hello.mjs</text><text x="76" y="280" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">127.0.0.1:4400</text><text x="60" y="338" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">svrngs share 4400 --kind hello</text><text x="40" y="450" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="black">Goes with Ana: opens while Ana’s computer is on.</text><line x1="570" y1="120" x2="1060" y2="120" stroke="black" stroke-width="3"/><text x="570" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">2</text><text x="596" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Carried: a folder the group keeps</text><path d="M570 172 L660 172 L670 182 L1060 182 L1060 304 L570 304 Z" fill="white" stroke="black" stroke-width="3"/><text x="588" y="212" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">~/svrngs/Elm/apps/guestbook/</text><rect x="588" y="228" width="160" height="30" fill="plum" stroke="black" stroke-width="2"/><text x="598" y="249" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">index.html</text><rect x="758" y="228" width="130" height="30" fill="plum" stroke="black" stroke-width="2"/><text x="768" y="249" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">index.js</text><rect x="588" y="266" width="160" height="30" fill="gold" stroke="black" stroke-width="2"/><text x="598" y="287" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">svrngs/acts</text><text x="760" y="287" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">reads and writes the record</text><line x1="645" y1="304" x2="645" y2="330" stroke="black" stroke-width="2"/><rect x="600" y="330" width="90" height="54" fill="white" stroke="black" stroke-width="3"/><line x1="591" y1="390" x2="699" y2="390" stroke="black" stroke-width="4"/><text x="645" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Ana</text><line x1="795" y1="304" x2="795" y2="330" stroke="black" stroke-width="2"/><rect x="750" y="330" width="90" height="54" fill="white" stroke="black" stroke-width="3"/><line x1="741" y1="390" x2="849" y2="390" stroke="black" stroke-width="4"/><text x="795" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Bo</text><line x1="945" y1="304" x2="945" y2="330" stroke="black" stroke-width="2"/><rect x="900" y="330" width="90" height="54" fill="white" stroke="black" stroke-width="3"/><line x1="891" y1="390" x2="999" y2="390" stroke="black" stroke-width="4"/><text x="945" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Cy</text><text x="570" y="450" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="black">Every computer in Elm serves it.</text><rect x="566" y="471.66" width="293" height="22.419999999999998" fill="yellow"/><text x="570" y="488" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="black">Opens while any of them is on.</text><line x1="24" y1="536" x2="1076" y2="536" stroke="black" stroke-width="3"/><g transform="translate(53 563.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1005" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="985" y="555" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="921" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="901" y="555" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="795" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="775" y="555" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="725" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="705" y="555" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="613" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="593" y="555" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="529" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-s
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
<title id="t">Money: nobody owes until they say yes</title>
<desc id="d">Kim adds pizza, $54, and ticks Ana and Bo. Bo says yes, so Bo’s share counts. Ana’s Money asks: Kim says you were in on pizza: $18.00, with Yes, I was in on pizza and Not me. Until Ana says yes, Ana owes nothing: Kim names people but never signs for them.</desc>
<rect x="0" y="0" width="1100" height="560" fill="white"/>
<rect x="1.5" y="1.5" width="1097" height="557" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1052" height="64" fill="salmon" stroke="black" stroke-width="3"/><text x="46" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="start" fill="black">Nobody owes until they say yes.</text><line x1="40" y1="120" x2="380" y2="120" stroke="black" stroke-width="3"/><text x="40" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">1</text><text x="66" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Kim adds what Kim paid</text><rect x="40" y="172" width="340" height="250" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="172" width="121.5" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Kim’s Money</text><text x="58" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">What it was for</text><rect x="220" y="214" width="140" height="30" fill="white" stroke="black" stroke-width="2"/><text x="230" y="236" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">pizza</text><text x="58" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">How much</text><rect x="220" y="254" width="140" height="30" fill="white" stroke="black" stroke-width="2"/><text x="230" y="276" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">54</text><text x="58" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Who was in on it?</text><rect x="220" y="300" width="18" height="18" fill="none" stroke="black" stroke-width="2"/><path d="M223 309 L227.2 313.5 L235 304.2" fill="none" stroke="black" stroke-width="3.2"/><text x="246" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Ana</text><rect x="296" y="300" width="18" height="18" fill="none" stroke="black" stroke-width="2"/><path d="M299 309 L303.2 313.5 L311 304.2" fill="none" stroke="black" stroke-width="3.2"/><text x="322" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Bo</text><rect x="58" y="356" width="191" height="34" fill="yellow" stroke="black" stroke-width="3"/><text x="70" y="377" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">Add it, paid by you</text><line x1="384" y1="300" x2="418" y2="300" stroke="black" stroke-width="3"/><path d="M430 300 L418.0 306.0 L418.0 294.0 Z" fill="black"/><line x1="436" y1="120" x2="1060" y2="120" stroke="black" stroke-width="3"/><text x="436" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">2</text><text x="462" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Each says so themselves</text><rect x="436" y="172" width="624" height="92" fill="white" stroke="black" stroke-width="3"/><rect x="436" y="172" width="45" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="449" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo</text><path d="M454 236 L459.6 242 L470 229.6" fill="none" stroke="black" stroke-width="3.2"/><text x="480" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Bo said yes: Bo’s share counts.</text><rect x="436" y="280" width="624" height="142" fill="white" stroke="black" stroke-width="3"/><rect x="436" y="280" width="121.5" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="449" y="303" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s Money</text><text x="454" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Kim says you were in on pizza: $18.00.</text><rect x="454" y="362" width="218" height="34" fill="yellow" stroke="black" stroke-width="3"/><text x="466" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">Yes, I was in on pizza</text><rect x="686" y="362" width="77" height="34" fill="white" stroke="black" stroke-width="3"/><text x="698" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">Not me</text><rect x="36" y="454.52" width="737" height="21.24" fill="yellow"/><text x="40" y="470" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Until Ana says yes, Ana owes nothing. Kim names people, but never signs for them.</text><line x1="24" y1="496" x2="1076" y2="496" stroke="black" stroke-width="3"/><g transform="translate(53 523.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1005" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="985" y="515" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="921" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="901" y="515" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="795" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="775" y="515" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="725" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="705" y="515" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="613" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="593" y="515" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="529" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="509" y="515" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
<title id="t">Three links, each for someone different</title>
<desc id="d">Invite someone to House lets in a new person, who can open the group’s record and what everyone lends; the link works for a day. Add your phone or another computer lets you in again, as you. Have a guest lets in a guest for 48, 24 or 6 hours, who opens only what Cy lends and never the group’s record.</desc>
<rect x="0" y="0" width="1100" height="560" fill="white"/>
<rect x="1.5" y="1.5" width="1097" height="557" fill="none" stroke="black" stroke-width="3"/>

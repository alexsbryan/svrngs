<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d">
<title id="t">One person decides who is removed</title>
<desc id="d">Bo can’t remove Dee, so Bo’s ask goes to Sam, who made House and decides. Sam runs svrngs remove Dee --group House. Dee is out of House on every computer and phone; what Dee already has stays, and nothing new reaches Dee.</desc>
<rect x="0" y="0" width="1100" height="540" fill="white"/>
<rect x="1.5" y="1.5" width="1097" height="537" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1052" height="64" fill="salmon" stroke="black" stroke-width="3"/><text x="46" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="start" fill="black">One person decides who is removed.</text><rect x="40" y="120" width="200" height="110" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="120" width="45" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo</text><text x="56" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">can’t remove Dee, so</text><text x="56" y="202.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">asks Sam</text><line x1="242" y1="175" x2="302" y2="175" stroke="black" stroke-width="3"/><path d="M314 175 L302.0 181.0 L302.0 169.0 Z" fill="black"/><text x="252" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">asks</text><rect x="318" y="120" width="322" height="110" fill="white" stroke="black" stroke-width="3"/><rect x="318" y="120" width="53.5" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="331" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Sam</text><text x="334" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">made House, so decides:</text><text x="334" y="212" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">svrngs remove Dee --group House</text><text x="40" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Everyone sees Bo’s ask. Dee stays in until Sam removes Dee.</text><rect x="36" y="323.66" width="264.5" height="22.419999999999998" fill="yellow"/><text x="40" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="black">Dee is out on every device.</text><line x1="640" y1="175" x2="688" y2="175" stroke="black" stroke-width="3"/><path d="M700 175 L688.0 181.0 L688.0 169.0 Z" fill="black"/><rect x="704" y="120" width="356" height="330" fill="white" stroke="black" stroke-width="3"/><rect x="704" y="120" width="53.5" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="717" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Dee</text><rect x="730" y="180" width="150" height="90" fill="white" stroke="black" stroke-width="3"/><line x1="715" y1="276" x2="895" y2="276" stroke="black" stroke-width="4"/><rect x="744" y="194" width="122" height="62" fill="gold" stroke="black" stroke-width="2"/><text x="805" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">what Dee</text><text x="805" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">already has</text><rect x="960" y="172" width="52" height="94" fill="white" stroke="black" stroke-width="3"/><line x1="978.2" y1="258" x2="993.8" y2="258" stroke="black" stroke-width="3"/><path d="M892 207 L918 233 M918 207 L892 233" fill="none" stroke="tomato" stroke-width="3.2"/><path d="M1023 207 L1049 233 M1049 207 L1023 233" fill="none" stroke="tomato" stroke-width="3.2"/><text x="724" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Out of House on the computer and the</text><text x="724" y="360.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">phone. Nothing new reaches Dee.</text><text x="724" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">What Dee already has stays.</text><line x1="24" y1="476" x2="1076" y2="476" stroke="black" stroke-width="3"/><g transform="translate(53 503.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1005" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="985" y="495" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="921" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="901" y="495" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="795" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="775" y="495" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="725" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="705" y="495" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="613" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="593" y="495" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="529" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="509" y="495" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>
</svg>

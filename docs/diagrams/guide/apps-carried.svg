<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
<title id="t">A brought app opens while any computer is on</title>
<desc id="d">An app Ana lends opens only while Ana’s computer is on. Money, brought to Elm, lives in Elm’s folder on every computer in Elm, so with Ana’s computer off Kim still opens it from Bo’s.</desc>

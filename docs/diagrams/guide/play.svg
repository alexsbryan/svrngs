<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">Play: your game connects to your own computer</title>
<desc id="d">Ana presses Play on Sam’s minecraft, and the row says Connect to 127.0.0.1:41821. Copied. Ana’s Minecraft connects to that address on Ana’s own computer; svrngs carries it to Sam’s computer, which lent the port with svrngs share 25565 --tcp, and on to Sam’s Minecraft server on 25565.</desc>
<rect x="0" y="0" width="1200" height="580" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="577" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="96" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="900" text-anchor="start" fill="black">Play: your game connects to your computer.</text><text x="50" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="black">svrngs carries it to Sam’s server.</text><text x="1152" y="52" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="end" fill="black">guide/games</text><rect x="40" y="150" width="600" height="290" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="150" width="157" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s computer</text><rect x="60" y="200" width="560" height="80" fill="white" stroke="black" stroke-width="2"/><text x="76" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Sam’s minecraft</text><text x="76" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Connect to 127.0.0.1:41821. Copied.</text><rect x="536" y="210" width="60" height="34" fill="yellow" stroke="black" stroke-width="3"/><text x="566" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Play</text><rect x="60" y="310" width="220" height="110" fill="plum" stroke="black" stroke-width="3"/><text x="74" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Minecraft</text><text x="74" y="366" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Multiplayer,</text><text x="74" y="388" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Add Server</text><line x1="280" y1="365" x2="347" y2="365" stroke="black" stroke-width="3"/><path d="M358 365 L347.0 370.5 L347.0 359.5 Z" fill="black"/><rect x="360" y="310" width="260" height="110" fill="white" stroke="black" stroke-width="5"/><text x="376" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" fill="black">svrngs</text><rect x="372" y="355.1" width="143" height="17.7" fill="yellow"/><text x="376" y="368" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" fill="black">127.0.0.1:41821</text><text x="376" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">on Ana’s own computer</text><rect x="700" y="150" width="460" height="290" fill="white" stroke="black" stroke-width="3"/><rect x="700" y="150" width="157" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="713" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Sam’s computer</text><rect x="640" y="351" width="60" height="28" fill="skyblue" stroke="black" stroke-width="3"/><line x1="620" y1="365" x2="727" y2="365" stroke="black" stroke-width="3"/><path d="M738 365 L727.0 370.5 L727.0 359.5 Z" fill="black"/><text x="720" y="216" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">svrngs share 25565 --tcp</text><text x="720" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">lends the port as it is</text><rect x="740" y="310" width="170" height="110" fill="white" stroke="black" stroke-width="5"/><text x="756" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="756" y="368" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">checks it’s Ana</text><line x1="910" y1="365" x2="927" y2="365" stroke="black" stroke-width="3"/><path d="M938 365 L927.0 370.5 L927.0 359.5 Z" fill="black"/><rect x="940" y="310" width="200" height="110" fill="plum" stroke="black" stroke-width="3"/><text x="954" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Minecraft server</text><text x="954" y="368" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">:25565</text><rect x="36" y="470.8" width="559.2" height="23.599999999999998" fill="yellow" stroke="none" stroke-width="0"/><text x="40" y="488" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="black">The game sees only an address on Ana’s own computer.</text><line x1="24" y1="516" x2="1176" y2="516" stroke="black" stroke-width="3"/><g transform="translate(53 543.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="535" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="535" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="535" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="535" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="535" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="535" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">Give: the group keeps the game</title>
<desc id="d">Five panels in time. Cy’s computer keeps Minecraft and copies it every 5 minutes into the group’s folder on every computer. Cy moves it to Bo, and nothing moves until Bo presses Agree and keep it here. Bo’s computer goes 15 minutes with no copy. Dee is offered the newest copy, from 14:05, and Dee’s computer starts it. Bo’s computer comes back and its copy is listed, as Bo’s computer had it at 14:10, with Start instead.</desc>
<rect x="0" y="0" width="1200" height="620" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="617" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="96" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="900" text-anchor="start" fill="black">Give: the group keeps the game.</text><text x="50" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="black">One computer runs it; every computer holds its copies.</text><text x="1152" y="52" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="end" fill="black">guide/games</text><rect x="40" y="150" width="210" height="328" fill="white" stroke="black" stroke-width="2"/><text x="52" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">1</text><text x="72" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Kept by Cy’s</text><text x="72" y="202.1" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">computer</text><text x="52" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">A copy every 5 minutes,</text><text x="52" y="429.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">into the group’s folder</text><text x="52" y="449" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">on every computer.</text><rect x="266" y="150" width="210" height="328" fill="white" stroke="black" stroke-width="2"/><text x="278" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">2</text><text x="298" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Move it to… Bo</text><text x="278" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Nothing moves until Bo</text><text x="278" y="429.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">says yes.</text><rect x="492" y="150" width="210" height="328" fill="white" stroke="black" stroke-width="2"/><text x="504" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">3</text><text x="524" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo’s computer</text><text x="524" y="202.1" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">goes quiet</text><text x="504" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">15 minutes with no copy.</text><text x="504" y="429.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Every page says when it</text><text x="504" y="449" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">last answered.</text><rect x="718" y="150" width="210" height="328" fill="white" stroke="black" stroke-width="2"/><text x="730" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">4</text><text x="750" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Keep it here?</text><text x="730" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Dee’s computer starts</text><text x="730" y="429.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">the newest copy. At most</text><text x="730" y="449" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">about 5 minutes lost.</text><rect x="944" y="150" width="210" height="328" fill="white" stroke="black" stroke-width="2"/><text x="956" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">5</text><text x="976" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo’s computer</text><text x="976" y="202.1" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">comes back</text><text x="956" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Its copy is listed.</text><text x="956" y="429.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Nothing merged, nothing</text><text x="956" y="449" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">thrown away.</text><rect x="56" y="240" width="80" height="48" fill="plum" stroke="black" stroke-width="3"/><line x1="48" y1="294" x2="144" y2="294" stroke="black" stroke-width="4"/><text x="96" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">Cy</text><line x1="140" y1="262" x2="172.62691271532864" y2="239.16116109926995" stroke="black" stroke-width="2" stroke-dasharray="5 4"/><path d="M180 234 L175.2 242.8 L170.0 235.5 Z" fill="black"/><rect x="184" y="218" width="50" height="30" fill="white" stroke="black" stroke-width="2"/><text x="209" y="239" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">Bo</text><line x1="140" y1="262" x2="173.9459448540332" y2="299.34053933943653" stroke="black" stroke-width="2" stroke-dasharray="5 4"/><path d="M180 306 L170.6 302.4 L177.3 296.3 Z" fill="black"/><rect x="184" y="290" width="50" height="30" fill="white" stroke="black" stroke-width="2"/><text x="209" y="311" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">Dee</text><text x="184" y="348" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">copies</text><rect x="282" y="236" width="64" height="38" fill="white" stroke="black" stroke-width="3"/><line x1="275.6" y1="280" x2="352.4" y2="280" stroke="black" stroke-width="4"/><text x="314" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">Cy</text><line x1="354" y1="255" x2="380" y2="255" stroke="black" stroke-width="2.5"/><path d="M390 255 L380.0 260.0 L380.0 250.0 Z" fill="black"/><rect x="396" y="236" width="64" height="38" fill="plum" stroke="black" stroke-width="3"/><line x1="389.6" y1="280" x2="466.4" y2="280" stroke="black" stroke-width="4"/><text x="428" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">Bo</text><rect x="274" y="330" width="209" height="34" fill="yellow" stroke="black" stroke-width="3"/><text x="378.5" y="353" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="black">Agree and keep it here</text><rect x="557" y="236" width="80" height="48" fill="white" stroke="black" stroke-width="3" stroke-dasharray="7 5"/><line x1="549" y1="290" x2="645" y2="290" stroke="black" stroke-width="4"/><text x="597" y="312" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">Bo</text><text x="597" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="black">15 min</text><text x="597" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">no copy</text><rect x="730" y="240" width="74" height="30" fill="white" stroke="black" stroke-width="2"/><text x="767" y="261" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">14:05</text><line x1="808" y1="255" x2="832" y2="255" stroke="black" stroke-width="2.5"/><path d="M842 255 L832.0 260.0 L832.0 250.0 Z" fill="black"/><rect x="848" y="236" width="64" height="38" fill="plum" stroke="black" stroke-width="3"/><line x1="841.6" y1="280" x2="918.4" y2="280" stroke="black" stroke-width="4"/><text x="880" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">Dee</text><rect x="726" y="330" width="209" height="34" fill="yellow" stroke="black" stroke-width="3"/><text x="830.5" y="353" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="black">Agree and keep it here</text><rect x="956" y="226" width="186" height="76" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="966" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Minecraft as Bo’s</text><text x="966" y="269.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">computer had it at</text><text x="966" y="289" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">14:10</text><rect x="956" y="330" width="133" height="34" fill="white" stroke="black" stroke-width="3"/><text x="1022.5" y="353" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="black">Start instead</text><line x1="40" y1="500" x2="1143" y2="500" stroke="black" stroke-width="2"/><path d="M1154 500 L1143.0 505.5 L1143.0 494.5 Z" fill="black"/><text x="1140" y="488" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="black">time</text><rect x="36" y="522.8" width="527.4" height="23.599999999999998" fill="yellow" stroke="none" stroke-width="0"/><text x="40" y="540" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="black">The game doesn’t depend on one computer being on.</text><line x1="24" y1="556" x2="1176" y2="556" stroke="black" stroke-width="3"/><g transform="translate(53 583.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="575" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="575" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="575" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="575" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="575" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="575" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>
</svg>

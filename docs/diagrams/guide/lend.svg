<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Lend: lend it once, and your group opens it</title>
<desc id="d">Sam lends Jellyfin, on localhost:8096, with Lend jellyfin to everyone in your groups or svrngs share 8096. Bo opens Sam’s jellyfin from the home page and Ana from a phone. Before Jellyfin answers, Sam’s computer checks who is asking, adds the app’s password, which stays on Sam’s computer, and keeps refused paths closed. Someone not in the group gets nothing. No port is opened on Sam’s router.</desc>
<rect x="0" y="0" width="1200" height="640" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="637" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="96" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="900" text-anchor="start" fill="black">Lend it once. Your group opens it.</text><text x="50" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="black">Sam’s computer checks each ask before Jellyfin sees it.</text><text x="1152" y="52" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="end" fill="black">guide/lend</text><rect x="40" y="150" width="600" height="355" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="150" width="157" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Sam’s computer</text><rect x="60" y="204" width="190" height="110" fill="plum" stroke="black" stroke-width="3"/><text x="74" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Jellyfin</text><text x="74" y="262" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">localhost:8096</text><rect x="320" y="196" width="300" height="200" fill="white" stroke="black" stroke-width="5"/><text x="338" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Before it answers</text><path d="M337 257 L341.9 262.25 L351 251.4" fill="none" stroke="black" stroke-width="3.2"/><text x="362" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">checks who’s asking</text><path d="M337 301 L341.9 306.25 L351 295.4" fill="none" stroke="black" stroke-width="3.2"/><text x="362" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">adds the app’s password; it</text><text x="362" y="326.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">stays here</text><path d="M338 355 L350 367 M350 355 L338 367" fill="none" stroke="tomato" stroke-width="3.2"/><text x="362" y="366" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">keeps refused paths closed</text><line x1="320" y1="260" x2="265" y2="260" stroke="black" stroke-width="3"/><path d="M254 260 L265.0 254.5 L265.0 265.5 Z" fill="black"/><rect x="60" y="420" width="382" height="34" fill="yellow" stroke="black" stroke-width="3"/><text x="251" y="443" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Lend jellyfin to everyone in your groups</text><text x="60" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">or</text><text x="84" y="482" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">svrngs share 8096</text><rect x="622" y="296" width="88" height="28" fill="skyblue" stroke="black" stroke-width="3"/><line x1="708" y1="310" x2="635" y2="310" stroke="black" stroke-width="3"/><path d="M624 310 L635.0 304.5 L635.0 315.5 Z" fill="black"/><line x1="710" y1="310" x2="780" y2="218" stroke="black" stroke-width="3"/><line x1="710" y1="310" x2="780" y2="362" stroke="black" stroke-width="3"/><line x1="710" y1="310" x2="780" y2="476" stroke="black" stroke-width="3"/><path d="M737 385 L753 401 M753 385 L737 401" fill="none" stroke="tomato" stroke-width="3.2"/><rect x="780" y="150" width="380" height="120" fill="white" stroke="black" stroke-width="3"/><rect x="780" y="150" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="793" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo’s computer</text><rect x="800" y="200" width="180" height="36" fill="plum" stroke="black" stroke-width="2"/><text x="812" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">Sam’s jellyfin</text><text x="994" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">on the home page</text><rect x="780" y="290" width="380" height="140" fill="white" stroke="black" stroke-width="3"/><rect x="780" y="290" width="129" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="793" y="313" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s phone</text><rect x="802" y="334" width="34" height="61" fill="white" stroke="black" stroke-width="3"/><line x1="813.9" y1="387" x2="824.1" y2="387" stroke="black" stroke-width="3"/><rect x="856" y="346" width="180" height="36" fill="plum" stroke="black" stroke-width="2"/><text x="868" y="370" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">Sam’s jellyfin</text><rect x="780" y="446" width="380" height="60" fill="white" stroke="black" stroke-width="3"/><rect x="780" y="446" width="175" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="793" y="469" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Not in the group</text><rect x="964" y="459" width="176" height="34" fill="tomato" stroke="black" stroke-width="2"/><path d="M978 470 L990 482 M990 470 L978 482" fill="none" stroke="black" stroke-width="3.2"/><text x="1000" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">gets nothing</text><rect x="36" y="530.8" width="697" height="23.599999999999998" fill="yellow" stroke="none" stroke-width="0"/><text x="40" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="black">Bo and Ana open it as themselves. No port opened on Sam’s router.</text><line x1="24" y1="576" x2="1176" y2="576" stroke="black" stroke-width="3"/><g transform="translate(53 603.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="595" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="595" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="595" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="595" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="595" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="608" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="595" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>

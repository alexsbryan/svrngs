<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">What your app gets: who is asking, verified</title>
<desc id="d">Bo opens Ana’s hello. The request reaches Ana’s computer, which strips any x-svrngs- header sent and sets x-svrngs-key, x-svrngs-person and x-svrngs-user, then passes it to the app on 127.0.0.1:4400. Entries the answer names in x-svrngs-append are signed by Bo’s own computer into the group’s record, and the browser never sees the header. Key on x-svrngs-key; show x-svrngs-person.</desc>
<rect x="0" y="0" width="1200" height="620" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="617" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="64" fill="salmon" stroke="black" stroke-width="3"/><text x="46" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="start" fill="black">What your app gets: who’s asking, verified.</text><rect x="40" y="116" width="290" height="396" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="116" width="138.5" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Bo’s computer</text><rect x="58" y="166" width="254" height="92" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="72" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">Ana’s hello</text><text x="72" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Hello, Bo</text><rect x="58" y="380" width="254" height="112" fill="gold" stroke="black" stroke-width="2"/><text x="72" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">signs it as Bo, into the</text><text x="72" y="428.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">group’s record</text><text x="72" y="474" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">hello/visit</text><rect x="422" y="116" width="738" height="260" fill="white" stroke="black" stroke-width="3"/><rect x="422" y="116" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="435" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s computer</text><rect x="330" y="200" width="92" height="24" fill="skyblue" stroke="black" stroke-width="2"/><line x1="312" y1="212" x2="434" y2="212" stroke="black" stroke-width="3"/><path d="M446 212 L434.0 218.0 L434.0 206.0 Z" fill="black"/><rect x="450" y="166" width="392" height="192" fill="white" stroke="black" stroke-width="5"/><path d="M463 187 L477 201 M477 187 L463 201" fill="none" stroke="tomato" stroke-width="3.2"/><text x="486" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">strips any</text><text x="574" y="200" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">x-svrngs-*</text><text x="679.6" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">sent</text><path d="M463 230 L467.9 235.25 L477 224.4" fill="none" stroke="black" stroke-width="3.2"/><text x="486" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">sets</text><rect x="464" y="258.24" width="190.4" height="18.88" fill="yellow"/><text x="468" y="272" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">x-svrngs-key: 7d2e…</text><text x="828" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="black">key on this</text><text x="468" y="302" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">x-svrngs-person: Bo</text><text x="828" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="black">show this</text><text x="468" y="332" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">x-svrngs-user: Bo-7d2e…</text><line x1="844" y1="262" x2="888" y2="262" stroke="black" stroke-width="3"/><path d="M900 262 L888.0 268.0 L888.0 256.0 Z" fill="black"/><rect x="904" y="196" width="236" height="132" fill="plum" stroke="black" stroke-width="3"/><text x="920" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">your app</text><text x="920" y="262" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">node hello.mjs</text><text x="920" y="290" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="black">127.0.0.1:4400</text><line x1="1022" y1="330" x2="1022" y2="430" stroke="black" stroke-width="3"/><line x1="1022" y1="430" x2="328" y2="430" stroke="black" stroke-width="3"/><path d="M316 430 L328.0 424.0 L328.0 436.0 Z" fill="black"/><text x="350" y="414" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Your answer may name entries:</text><text x="350" y="458" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start" fill="black">x-svrngs-append: [{"group": …, "op": {"kind": "visit"}}]</text><text x="350" y="488" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Bo’s computer signs them; the browser never sees the header.</text><rect x="36" y="522.52" width="386" height="21.24" fill="yellow"/><text x="40" y="538" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Key on x-svrngs-key. Show x-svrngs-person.</text><line x1="24" y1="556" x2="1176" y2="556" stroke="black" stroke-width="3"/><g transform="translate(53 583.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="575" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="575" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="575" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="575" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="575" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="575" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>

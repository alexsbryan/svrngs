<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
<title id="t">Folders are matched by their last name</title>
<desc id="d">Ana’s ~/Music/rehearsals and Bo’s and Cy’s ~/Band/rehearsals share the last name rehearsals, so the three are one folder. Bo’s ~/Band/recordings has a different name and stays Bo’s own.</desc>
<rect x="0" y="0" width="1100" height="560" fill="white"/>
<rect x="1.5" y="1.5" width="1097" height="557" fill="none" stroke="black" stroke-width="3"/>

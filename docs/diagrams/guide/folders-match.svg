idth="2"/><text x="613" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="593" y="515" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="529" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="509" y="515" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">svrngs: your group’s things, on your group’s computers</title>
<desc id="d">A link in a chat lets a person in from a phone or a computer in seconds. Every member’s computer holds the whole record, with no server; a relay carries sealed bytes for phones. You stand at the center of your own rings, and nothing ranks a person.</desc>
<rect x="0" y="0" width="1200" height="700" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="697" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="112" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="start" fill="black">Your group’s things, on your group’s computers.</text><text x="50" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="black">No accounts. No passwords. No landlord.</text><text x="1152" y="56" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="end" fill="black">1 / 3</text><line x1="40" y1="150" x2="380" y2="150" stroke="black" stroke-width="3"/><text x="40" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">1</text><text x="66" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">A link in your chat</text><rect x="40" y="206" width="340" height="66" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="56" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="black">ana: movie night saturday?</text><text x="56" y="258" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="blue" text-decoration="underline">group.svrnme.sh/#…</text><line x1="150" y1="292" x2="106.07805481172477" y2="327.7882516348909" stroke="black" stroke-width="2.5"/><path d="M96 336 L102.0 322.7 L110.2 332.8 Z" fill="black"/><line x1="250" y1="292" x2="281.67760280436175" y2="330.0131233652341" stroke="black" stroke-width="2.5"/><path d="M290 340 L276.7 334.2 L286.7 325.9 Z" fill="black"/><rect x="72" y="346" width="46" height="83" fill="white" stroke="black" stroke-width="3"/><line x1="88.1" y1="421" x2="101.9" y2="421" stroke="black" stroke-width="3"/><rect x="78" y="394" width="34" height="20" fill="yellow" stroke="black" stroke-width="2"/><text x="95" y="409" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="black">Join</text><rect x="236" y="352" width="110" height="66" fill="white" stroke="black" stroke-width="3"/><line x1="225" y1="424" x2="357" y2="424" stroke="black" stroke-width="4"/><text x="246" y="386" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">$ curl … | sh</text><text x="40" y="464" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Phone: your name, Join.</text><text x="232" y="464" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Computer: one line.</text><rect x="36" y="501.08" width="140" height="25.959999999999997" fill="yellow"/><text x="40" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="black">Ten seconds.</text><line x1="420" y1="150" x2="820" y2="150" stroke="black" stroke-width="3"/><text x="420" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">2</text><text x="446" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Kept on your computers</text><line x1="495" y1="237" x2="745" y2="237" stroke="black" stroke-width="2"/><line x1="495" y1="237" x2="495" y2="387" stroke="black" stroke-width="2"/><line x1="495" y1="237" x2="745" y2="387" stroke="black" stroke-width="2"/><line x1="745" y1="237" x2="495" y2="387" stroke="black" stroke-width="2"/><line x1="745" y1="237" x2="745" y2="387" stroke="black" stroke-width="2"/><line x1="495" y1="387" x2="745" y2="387" stroke="black" stroke-width="2"/><rect x="450" y="210" width="90" height="54" fill="white" stroke="black" stroke-width="3"/><line x1="441" y1="270" x2="549" y2="270" stroke="black" stroke-width="4"/><rect x="462" y="220" width="66" height="34" fill="gold" stroke="black" stroke-width="2"/><text x="495" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="black">record</text><text x="495" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">ana</text><rect x="700" y="210" width="90" height="54" fill="white" stroke="black" stroke-width="3"/><line x1="691" y1="270" x2="799" y2="270" stroke="black" stroke-width="4"/><rect x="712" y="220" width="66" height="34" fill="gold" stroke="black" stroke-width="2"/><text x="745" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="black">record</text><text x="745" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">ben</text><rect x="450" y="360" width="90" height="54" fill="white" stroke="black" stroke-width="3"/><line x1="441" y1="420" x2="549" y2="420" stroke="black" stroke-width="4"/><rect x="462" y="370" width="66" height="34" fill="gold" stroke="black" stroke-width="2"/><text x="495" y="392" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="black">record</text><text x="495" y="442" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">cy</text><rect x="700" y="360" width="90" height="54" fill="white" stroke="black" stroke-width="3"/><line x1="691" y1="420" x2="799" y2="420" stroke="black" stroke-width="4"/><rect x="712" y="370" width="66" height="34" fill="gold" stroke="black" stroke-width="2"/><text x="745" y="392" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="black">record</text><text x="745" y="442" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">dee, always on</text><rect x="452" y="470" width="34" height="61" fill="white" stroke="black" stroke-width="3"/><line x1="463.9" y1="523" x2="474.1" y2="523" stroke="black" stroke-width="3"/><text x="469" y="550" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="black">eve</text><line x1="486" y1="502" x2="568" y2="502" stroke="black" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="568" y="482" width="120" height="40" fill="skyblue" stroke="black" stroke-width="3"/><text x="628" y="508" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle" fill="black">relay</text><line x1="688" y1="502" x2="745" y2="458" stroke="black" stroke-width="2.5" stroke-dasharray="7 5"/><text x="568" y="542" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="black">sees who, never what</text><text x="420" y="590" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="black">No server. Every computer holds the whole</text><text x="420" y="612.1" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="black">record.</text><line x1="860" y1="150" x2="1160" y2="150" stroke="black" stroke-width="3"/><text x="860" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">3</text><text x="886" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">No center but you</text><circle cx="1010" cy="366" r="150" fill="white" stroke="black" stroke-width="2"/><circle cx="1010" cy="366" r="118" fill="white" stroke="black" stroke-width="2"/><circle cx="1010" cy="366" r="86" fill="white" stroke="black" stroke-width="2"/><circle cx="1010" cy="366" r="54" fill="white" stroke="black" stroke-width="2"/><circle cx="1010" cy="366" r="26" fill="salmon" stroke="black" stroke-width="3"/><text x="1010" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">you</text><text x="1010" y="331" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="black">house</text><text x="1010" y="299" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="black">friends</text><text x="1010" y="267" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="black">the party</text><text x="1010" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="black">the town</text><line x1="1027.9053260465757" y1="378.78277353182074" x2="1064.5298565963897" y2="404.9293557559994" stroke="black" stroke-width="2.5"/><path d="M1072.668641163015 410.73970736137244 L1061.6 409.0 L1067.4 400.9 Z" fill="black"/><circle cx="1079.9935472729778" cy="415.9690238062082" r="8" fill="salmon" stroke="black" stroke-width="2.5"/><line x1="1087.3184533829406" y1="421.198340251044" x2="1138.5927961526802" y2="457.8035553648942" stroke="black" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M1146.7315807193056 463.61390697026724 L1135.7 461.9 L1141.5 453.7 Z" fill="black"/><text x="860" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="black">Reach grows only through someone</text><text x="860" y="578.1" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="black">who says yes.</text><text x="860" y="612" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">No profile. No feed. Nobody ranked.</text><line x1="24" y1="636" x2="1176" y2="636" stroke="black" stroke-width="3"/><g transform="translate(53 663.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="668" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="668" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="655" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="668" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="655" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="668" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="655" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="668" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="655" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="668" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="655" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="668" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="655" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>
</svg>

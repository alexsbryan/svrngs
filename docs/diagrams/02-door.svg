<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
<title id="t">svrngs: if it runs on localhost, your friends can use it</title>
<desc id="d">Ana shares an app on a port. Her computer’s door says who is asking, keeps the app’s secret in, and shuts out anyone removed. Ben opens it in his browser or plays at 127.0.0.1; Cy opens it on a phone. An app gets three things: who is asking, a shared record, and every member’s computer.</desc>
<rect x="0" y="0" width="1200" height="720" fill="white"/>
<rect x="1.5" y="1.5" width="1197" height="717" fill="none" stroke="black" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="112" fill="salmon" stroke="black" stroke-width="3"/><text x="48" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="start" fill="black">If it runs on localhost, your friends can use it.</text><text x="50" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="black">No login. No SDK. No port opened.</text><text x="1152" y="56" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="end" fill="black">2 / 3</text><rect x="40" y="172" width="500" height="330" fill="white" stroke="black" stroke-width="3"/><rect x="40" y="172" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="53" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ana’s computer</text><rect x="60" y="226" width="184" height="140" fill="plum" stroke="black" stroke-width="3"/><text x="72" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="black">any app on a port</text><text x="72" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Jellyfin</text><text x="234" y="284" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="end" fill="black">:8096</text><text x="72" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">a model</text><text x="234" y="310" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="end" fill="black">:8080</text><text x="72" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">Minecraft</text><text x="234" y="336" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="end" fill="black">:25565</text><rect x="60" y="398" width="74" height="32" fill="yellow" stroke="black" stroke-width="3"/><text x="97" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="black">Share</text><text x="146" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="black">one press</text><line x1="268" y1="300" x2="257" y2="300" stroke="black" stroke-width="3"/><path d="M246 300 L257.0 294.5 L257.0 305.5 Z" fill="black"/><rect x="268" y="214" width="252" height="202" fill="white" stroke="black" stroke-width="5"/><text x="286" y="246" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">the door</text><path d="M287 285 L291.9 290.25 L301 279.4" fill="none" stroke="black" stroke-width="3.2"/><text x="312" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">verifies who’s asking</text><path d="M287 329 L291.9 334.25 L301 323.4" fill="none" stroke="black" stroke-width="3.2"/><text x="312" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">keeps the app’s secret</text><path d="M288 367 L300 379 M300 367 L288 379" fill="none" stroke="tomato" stroke-width="3.2"/><text x="312" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">shuts out anyone removed</text><rect x="540" y="326" width="150" height="28" fill="skyblue" stroke="black" stroke-width="3"/><line x1="556" y1="340" x2="535" y2="340" stroke="black" stroke-width="3"/><path d="M524 340 L535.0 334.5 L535.0 345.5 Z" fill="black"/><text x="615" y="380" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" fill="black">encrypted</text><line x1="690" y1="340" x2="735" y2="262" stroke="black" stroke-width="3"/><line x1="690" y1="340" x2="735" y2="420" stroke="black" stroke-width="3"/><rect x="735" y="172" width="425" height="160" fill="white" stroke="black" stroke-width="3"/><rect x="735" y="172" width="147" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="748" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Ben’s computer</text><rect x="755" y="222" width="385" height="30" fill="whitesmoke" stroke="black" stroke-width="2"/><text x="765" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" fill="black">http://jellyfin-3f9a.localhost/</text><rect x="755" y="274" width="62" height="30" fill="yellow" stroke="black" stroke-width="3"/><text x="786" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="black">Play</text><text x="830" y="295" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" fill="black">→ 127.0.0.1:25565</text><rect x="735" y="352" width="425" height="150" fill="white" stroke="black" stroke-width="3"/><rect x="735" y="352" width="113" height="34" fill="salmon" stroke="black" stroke-width="3"/><text x="748" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="black">Cy’s phone</text><rect x="757" y="398" width="40" height="72" fill="white" stroke="black" stroke-width="3"/><line x1="771" y1="462" x2="783" y2="462" stroke="black" stroke-width="3"/><rect x="763" y="408" width="28" height="36" fill="plum" stroke="black" stroke-width="2"/><text x="818" y="432" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="black">Each app at its own address.</text><line x1="24" y1="536" x2="1176" y2="536" stroke="black" stroke-width="3"/><text x="40" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="start" fill="black">Your app gets three things</text><rect x="40" y="586" width="360" height="64" fill="plum" stroke="black" stroke-width="3"/><text x="54" y="612" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Who’s asking</text><text x="54" y="636" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" fill="black">X-Svrngs-Key</text><rect x="420" y="586" width="360" height="64" fill="plum" stroke="black" stroke-width="3"/><text x="434" y="612" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">A shared record</text><text x="434" y="636" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" fill="black">/svrngs/acts</text><rect x="800" y="586" width="360" height="64" fill="plum" stroke="black" stroke-width="3"/><text x="814" y="612" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="black">Every member’s computer</text><text x="814" y="636" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" fill="black">lent, or carried by the group</text><line x1="24" y1="656" x2="1176" y2="656" stroke="black" stroke-width="3"/><g transform="translate(53 683.14) scale(0.19)"><circle cx="0" cy="0" r="46" fill="none" stroke="gold" stroke-width="7"/><path d="M-42.87 -29.33 A46 46 0 1 1 42.87 -29.33" fill="none" stroke="black" stroke-width="4.5"/><path d="M46.84 -22.46 A46 46 0 1 1 3.96 51.79" fill="none" stroke="black" stroke-width="4.5"/><path d="M-3.96 51.79 A46 46 0 1 1 -46.84 -22.46" fill="none" stroke="black" stroke-width="4.5"/><circle cx="0" cy="-46" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/><circle cx="-39.84" cy="23" r="10" fill="salmon" stroke="black" stroke-width="4"/></g><text x="78" y="688" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" fill="black">svrngs</text><text x="1105" y="688" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">refused</text><rect x="1085" y="675" width="15" height="15" fill="tomato" stroke="black" stroke-width="2"/><text x="1021" y="688" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">let in</text><rect x="1001" y="675" width="15" height="15" fill="lightgreen" stroke="black" stroke-width="2"/><text x="895" y="688" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">wire &amp; hosts</text><rect x="875" y="675" width="15" height="15" fill="skyblue" stroke="black" stroke-width="2"/><text x="825" y="688" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">apps</text><rect x="805" y="675" width="15" height="15" fill="plum" stroke="black" stroke-width="2"/><text x="713" y="688" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">the record</text><rect x="693" y="675" width="15" height="15" fill="gold" stroke="black" stroke-width="2"/><text x="629" y="688" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="black">people</text><rect x="609" y="675" width="15" height="15" fill="salmon" stroke="black" stroke-width="2"/>
</svg>

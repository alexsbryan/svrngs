[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
maximum-db-staleness = "P1D"
# Maintenance notices, and unsoundness notices in code nothing here calls;
# vulnerability advisories stay fatal.
# scripts/advisories.py makes every exception expire at its review date.

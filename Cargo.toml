[workspace]
resolver = "3"
members = ["crates/svrngs-core", "crates/svrngs-engine", "crates/svrngs-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
svrngs-core = { path = "crates/svrngs-core" }
svrngs-engine = { path = "crates/svrngs-engine" }
svrngs-node = { path = "crates/svrngs-node" }
blake3 = "1.8"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

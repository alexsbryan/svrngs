[workspace]
resolver = "3"
members = ["crates/svrngs-core", "crates/svrngs-node", "crates/svrngs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
svrngs-core = { path = "crates/svrngs-core" }
svrngs-node = { path = "crates/svrngs-node" }
blake3 = "1.8"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# Dependencies are built optimised in dev and test builds; the workspace's own
# crates stay unoptimised.
[profile.dev.package."*"]
opt-level = 2

[workspace]
resolver = "3"
members = ["crates/svrngs-core", "crates/svrngs-runtime", "crates/svrngs-node", "crates/svrngs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
svrngs-core = { path = "crates/svrngs-core" }
svrngs-runtime = { path = "crates/svrngs-runtime" }
svrngs-node = { path = "crates/svrngs-node" }
blake3 = "1.8"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# Debug info is line tables only: a backtrace keeps its files and lines, and
# target/debug sheds the variable info, most of its bytes, that a debugger
# would read; svrngs is debugged by its traces (AGENTS.md 1).
[profile.dev]
debug = "line-tables-only"

# Dependencies are built optimised in dev and test builds; the workspace's own
# crates stay unoptimised.
[profile.dev.package."*"]
opt-level = 2

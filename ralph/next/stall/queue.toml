# svrngs stall — the streaming test's stalled range, fixed alone before the capability bundle (the operator, 2026-10-23: "Now, alone"). One loop per tree. Launch, from anywhere, once the tree is clean:
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py run --workdir ~/dev/svrngs \
#     --queue stall --install-launchd --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue stall
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-stall"
session_timeout = 5400
# One row and no audit_every, so no closing audit: the capability bundle's
# closing audit reads these commits with its own.
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
# The operator, 2026-10-22: "I want you to run the security rows with opus 5.5
# medium"; this row was the first of them. A bare id runs through
# `worker_bin`, the claude shim, where `variant` is --effort.
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "medium"

# svrngs onboarding — start with a current-base economizing pass. The first
# survey and estimate stop for the operator's budget and resolver decision.
# Operator's demo deadline: native/backend here, Node-only UI in its own
# onboarding-ui worktree/queue. Two Rust lanes exceed current memory headroom.
# SCOPE_PARALLEL.md freezes the shared contract and ownership.
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py run --workdir ~/dev/svrngs \
#     --queue onboarding --install-launchd --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs \
#     --queue onboarding
#
# After reinstalling the launch job, add CARGO_INCREMENTAL=0 to its
# EnvironmentVariables if the pass runs cargo checks.
label = "svrngs-onboarding"
session_timeout = 7200
# The explicit REVIEW-audit-onboarding-auto-1 row is now the final audit.
# Preserve all of its requirements; omit cadence generation so a parked audit
# cannot spawn another duplicate and the final reviewed tree is indexed once.
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "deepinfra/deepseek-ai/DeepSeek-V4.1-Flash"
review = "deepinfra/deepseek-ai/DeepSeek-V4.1-Flash"
resolve = "deepinfra/deepseek-ai/DeepSeek-V4.1-Flash"
variant = "medium"

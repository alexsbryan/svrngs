# svrngs give — any port through the door, a caller check on loopback, and Give, an app the group keeps, as its own package in apps/give (the operator, 2026-10-25; svrn-docs rings/current/GIVE.md). One loop per tree. Launch, from anywhere, once the tree is clean:
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py run --workdir ~/dev/svrngs \
#     --queue give --install-launchd --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue give
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-give"
session_timeout = 5400
# One closing audit for the queue, none inside it (the operator, 2026-10-15 and
# 2026-10-16). Fifteen rows, so a cadence of 20 never comes due inside it.
audit_every = 20
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "high"

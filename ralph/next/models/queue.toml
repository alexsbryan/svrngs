# svrngs models — the pantry's lean v0 (operator, 2026-10-22; svrn-docs rings/current/MODELS_ON_THE_RING.md). Written and held: "Write rows, hold". Launch, from anywhere, once the tree is clean (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py run --workdir ~/dev/svrngs \
#     --queue models --install-launchd --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue models
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-models"
session_timeout = 5400
# One closing audit for the queue, none inside it (the operator, 2026-10-15 and
# 2026-10-16: audits at the queue's end). Four rows, so a cadence of 10 never
# comes due inside it, and ralph adds the closing audit at the end.
audit_every = 10
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
# The operator, 2026-10-22: "I want glm-flash for the workers then opus 5.5
# medium for the review / audit". A `provider/model` pair runs through
# opencode (ralph.py `model_client`); a bare id runs through `worker_bin`, the
# claude shim, where `variant` is --effort. The id is the one commonwealth-ai's
# five-programs queue ran on the zai plan (its queue.toml). `variant` is one
# setting for every role (ralph.py:2775), so the workers carry "medium" too.
# The director (`resolve`) decides forks in the operator's place, closer to an
# audit than to a unit of work, so it runs on Opus with the review.
worker = "zai-coding-plan/glm-5.3-flash"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "medium"

# svrngs grapevine — the grapevine demo app, apps/grapevine/, at zero svrngs lines (operator, 2026-10-15; svrn-docs rings/current/GRAPEVINE_DEMO.md). The last queue before V1. Launch, from anywhere, once the groups queue is done (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue grapevine --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue grapevine --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue grapevine
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-grapevine"
session_timeout = 5400
# The operator, 2026-10-16, of groups' mid-queue audit: "Push it to the end",
# as for arch on 2026-10-15. The queue has 5 units, so no cadence audit falls
# inside it, and the closing audit still runs once the last row is done.
audit_every = 9
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "high"

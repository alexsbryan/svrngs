# svrngs events — the primitive event (a post in a group, and the people who answer it) and its reference app in apps/events/, run on one host; nothing new in svrngs (operator, 2026-10-13; svrn-docs rings/current/EVENTS.md §9). Launch, from anywhere, once the onair queue is done (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue events --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue events --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue events
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0; add it
# under EnvironmentVariables after any reinstall (the host's disk is shared).
label = "svrngs-events"
session_timeout = 5400
audit_every = 4
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "high"

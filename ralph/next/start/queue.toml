# svrngs start — getting started: a friend's llama-server lent and reached from any member's computer, phone and tools; a home page someone a bit afraid technically can find their way around; the document a newcomer follows; and findings #126-#129 and #131 (operator, 2026-10-13). Launch, from anywhere, once the relay queue is done (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue start --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue start --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue start

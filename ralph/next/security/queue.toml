# svrngs security — the fixes svrn-docs rings/current/WHAT_CAN_ACT_AS_YOU.md §6 queues (operator, 2026-10-22: "Agreed. Let's queue the security work"). Held until the operator says when; one loop per tree, so it starts after the models loop stops. Launch, from anywhere, once the tree is clean:
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py run --workdir ~/dev/svrngs \
#     --queue security --install-launchd --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue security
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-security"
session_timeout = 5400
# One closing audit for the queue, none inside it (the operator, 2026-10-15 and
# 2026-10-16). Six rows, so a cadence of 10 never comes due inside it.
audit_every = 10
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
# As the operator set the models queue, 2026-10-22: deepseek-flash for the
# workers, Opus 5.5 for the review, the closing audit and the director.
worker = "deepseek/deepseek-flash"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "high"

# svrngs groups — two groups of one name told apart, a phone told within the cap when the link's computer sleeps, leaving a group, a key per group on computers, and their run (operator, 2026-10-14; svrn-docs rings/current/LEAVING.md). Launch, from anywhere, once the events queue is done (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue groups --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue groups --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue groups
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0; add it
# under EnvironmentVariables after any reinstall (the host's disk is shared).
label = "svrngs-groups"
session_timeout = 5400
audit_every = 4
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "high"

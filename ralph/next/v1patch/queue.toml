# svrngs v1patch — V1's first patch: the tests' loopback allowance out of the published group page (operator, 2026-10-16; svrn-docs rings/current/WHAT_RUNS_AS_YOU.md §2, §8). One row, no audit: its own test fails first on its plant. Launch, from anywhere (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue v1patch --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue v1patch --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue v1patch
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-v1patch"
session_timeout = 5400
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"

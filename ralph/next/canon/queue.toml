# svrngs canon — after V1: the trust floor, pinned carried code, then canon carried as House rules (operator, 2026-10-16; svrn-docs rings/current/WHAT_RUNS_AS_YOU.md, CANON_IN_SVRNGS.md). Launch, from anywhere, once v1patch is done and the tree is clean (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue canon --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue canon --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue canon
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-canon"
session_timeout = 5400
# One closing audit for the queue, none inside it (the operator, 2026-10-15 and
# 2026-10-16: audits at the queue's end). Nine units since 2026-10-17, so a
# cadence of 10 never comes due inside it.
audit_every = 10
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "high"

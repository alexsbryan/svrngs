# svrngs bash — Demo C's dry run's findings, closed (demo/runs/c/dry-2026-10-12/README.md, "What it found"; operator, 2026-10-12). Launch, from anywhere:
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue bash --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue bash --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue bash

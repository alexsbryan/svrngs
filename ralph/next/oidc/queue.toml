# svrngs oidc — sign in with svrngs, the trial (operator, 2026-10-21; svrn-docs rings/current/SIGN_IN_WITH_SVRNGS.md). Launch, from anywhere, once the tree is clean (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py run --workdir ~/dev/svrngs \
#     --queue oidc --install-launchd --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue oidc
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-oidc"
session_timeout = 5400
# One closing audit for the queue, none inside it (the operator, 2026-10-15 and
# 2026-10-16: audits at the queue's end). Nine units, so a cadence of 10 never
# comes due inside it, and ralph adds the closing audit at the end.
audit_every = 10
# Bare ids run through this bin; the models below are provider/model pairs,
# so the loop runs them through opencode instead (ralph.py `model_client`).
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
# A `provider/model` pair runs through opencode (ralph.py `model_client`), not
# the claude shim: the operator, 2026-10-21, "Use deepseek flash".
worker = "deepseek/deepseek-flash"
review = "deepseek/deepseek-flash"
resolve = "deepseek/deepseek-flash"
variant = "high"

# svrngs guests — after canon: a member's guest, for a visit, seen by the house (operator, 2026-10-16; svrn-docs rings/current/GUESTS.md, its §10 decided). Launch, from anywhere, once the operator sets the ceiling and the tree is clean (one loop per tree):
#
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py supervise --workdir ~/dev/svrngs \
#     --queue guests --install-launchd -- python3 ~/dev/commonwealth-ai/scripts/ralph.py \
#     run --workdir ~/dev/svrngs --queue guests --max-stall 3
#   python3 ~/dev/commonwealth-ai/scripts/ralph.py start --workdir ~/dev/svrngs --queue guests
#
# The plist the first command writes carries no CARGO_INCREMENTAL=0. Add it
# under EnvironmentVariables after any reinstall, because the host's disk is
# shared.
label = "svrngs-guests"
session_timeout = 5400
# One closing audit for the queue, none inside it (the operator, 2026-10-15 and
# 2026-10-16: audits at the queue's end). Ten units, so a cadence of 11 never
# comes due inside it.
audit_every = 11
worker_bin = "/Users/alexsbryan/dev/commonwealth-ai/scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
worker = "claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "high"

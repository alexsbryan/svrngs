# The podman inside the gate image (Containerfile), rootless in a rootless
# container.
[containers]
# Podman sets net.ipv4.ping_group_range in each container by default; the
# outer container's /proc/sys is read-only, so every run failed ("open
# `/proc/sys/net/ipv4/ping_group_range`: Read-only file system").
default_sysctls = []
# host.containers.internal as the gate container itself, whose loopback
# the services a scene's containers call listen on: the HolyArrs scene's
# Jellyfin at 127.0.0.1 (apps/jellyfin/check/check.sh, network.xml),
# which HolyArrs tells of each import (apps/holyarrs/check/services.mjs,
# `media-servers`). Podman read the gate's own /etc/hosts as its base,
# whose host.containers.internal is the outer podman's, 169.254.1.2, the
# computer under the gate: H4 was never met, "Movie Night finds Ana's
# newly imported copy not observed in 90000ms", and a fetch from a pod
# there was refused. So no base, and slirp4netns's address for the
# gate's loopback, which allow_host_loopback opens, below.
base_hosts_file = "none"
host_containers_internal_ip = "10.0.2.2"

[engine]
# No systemd or journald in the container to hand cgroups or events to.
cgroup_manager = "cgroupfs"
events_logger = "file"
network_cmd_options = ["allow_host_loopback=true"]

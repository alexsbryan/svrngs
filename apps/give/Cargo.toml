# Give: a group keeps an app on one member's computer at a time, from the
# app's own published image, in rootless podman (svrn-docs
# rings/current/GIVE.md §7a). This crate is its keeper program; the runtime
# under it is svrngs-keeper's (../svrngs-keeper).
#
# It links no svrngs crate and takes nothing from the workspace's tables, so
# it reaches svrngs through its public surface alone and moves to a
# repository of its own at no cost (tests/surface.rs holds that). It is a
# member of the svrngs workspace only so the gate's rustfmt, clippy and tests
# reach it.
[package]
name = "give"
# 0.2.0: the first that stops an app with a copy, and says so in its
# `ready` (docs/APP_ACCESS_AND_STOP.md §4); the page offers a stop only
# where the keeping computer's Give said it.
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1.8"
# Give's one fold, which its page runs too (fold/Cargo.toml).
give-fold = { path = "fold" }
# The card and the runtime that keeps it on this computer, which know no group.
svrngs-keeper = { path = "../svrngs-keeper" }
# A clean stop on SIGINT and SIGTERM: the keeper program's last snapshot.
# Each challenge of svrngs's proof (record.rs `challenge`), as svrngs draws
# its own: the version the lock already holds for svrngs-node.
getrandom = "0.3"
libc = "0.2"
# svrngs's proof that it holds the token, checked before give sends it
# (record.rs `proof`): HMAC-SHA256, by the ring the lock already holds for
# svrngs's own.
ring = "0.17"
serde_json = "1"
# The card is the app's own compose.yaml. serde_yaml 0.9 is marked
# deprecated by its author and still the YAML reader the registry here
# already holds; give reads it into a Value and walks it itself (card.rs).
serde_yaml = "0.9"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

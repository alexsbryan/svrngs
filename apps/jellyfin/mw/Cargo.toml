# Jellyfin's middleware (demo/runs/mw/2026-10-08/README.md; DESIGN §3, "The
# room", call 6): a program the lender runs on their own computer, in front
# of Jellyfin. A workspace of its own, so the root workspace neither builds,
# lints nor tests it and scripts/check.sh stays free of Jellyfin;
# apps/jellyfin/check/check.sh runs it.
[workspace]

[package]
name = "jellyfin-mw"
version = "0.1.0"
# Upstream's edition (commonwealth-ai Cargo.toml:289 at d4356181c), so the
# fork lands unchanged.
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# viewer.rs's, at upstream's requirements (commonwealth-ai Cargo.toml
# :431-483 at d4356181c); reqwest without TLS, since Jellyfin is on loopback.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# The forward (forward.rs): hyper's HTTP/1 server and client, one
# connection to Jellyfin per request, at the versions svrngs's door uses
# (crates/svrngs-node/Cargo.toml); its runtime; and its log.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

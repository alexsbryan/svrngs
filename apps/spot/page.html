<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!-- spot's chat page: opened from a friend's svrngs home page, on a phone or a
     computer. It asks only its own origin (/spot.json, /v1/chat/completions);
     svrngs carries each request to the lender's computer as the person who
     opened it, and the lender's svrngs adds the key. Chats stay in this
     browser's storage for this lend, never on the lender's computer. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <title>Chat</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --fg: #1b1b1a;
        --dim: #6b6a66;
        --line: #dedcd6;
        --mine: #e7e4dc;
        --accent: #2f5d50;
        --warn: #8a3b12;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161616;
          --fg: #ecebe8;
          --dim: #9a9893;
          --line: #2c2b29;
          --mine: #262523;
          --accent: #8cc3b0;
          --warn: #f0a36f;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        padding-top: max(10px, env(safe-area-inset-top));
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      select,
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      select {
        max-width: 45vw;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 6px;
      }
      button {
        background: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      #standing {
        padding: 6px 16px;
        font-size: 13px;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
      }
      #standing.over {
        color: var(--warn);
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .msg {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      .msg.assistant {
        white-space: normal;
      }
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md p,
      .md ul,
      .md ol,
      .md blockquote,
      .md .code,
      .md .wide {
        margin: 0 0 0.7em;
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4,
      .md h5,
      .md h6 {
        margin: 1em 0 0.4em;
        line-height: 1.3;
      }
      .md h1 {
        font-size: 1.3em;
      }
      .md h2 {
        font-size: 1.18em;
      }
      .md h3 {
        font-size: 1.06em;
      }
      .md h4,
      .md h5,
      .md h6 {
        font-size: 1em;
      }
      .md ul,
      .md ol {
        padding-left: 1.4em;
      }
      .md li + li {
        margin-top: 0.25em;
      }
      .md li > ul,
      .md li > ol,
      .md li > p {
        margin: 0.25em 0 0;
      }
      .md blockquote {
        border-left: 3px solid var(--line);
        padding-left: 0.8em;
        margin-left: 0;
        color: var(--dim);
      }
      .md hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 1em 0;
      }
      .md code {
        font: 0.88em/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--mine);
        border-radius: 4px;
        padding: 0.1em 0.3em;
      }
      .md .code {
        position: relative;
      }
      .md pre {
        margin: 0;
        background: var(--mine);
        border-radius: 8px;
        padding: 10px 12px;
        padding-top: 30px;
        overflow-x: auto;
        white-space: pre;
      }
      .md pre code {
        background: none;
        padding: 0;
        font-size: 13.5px;
      }
      .md .copy {
        position: absolute;
        top: 4px;
        right: 4px;
        font-size: 12px;
        padding: 2px 8px;
        color: var(--dim);
      }
      .md .wide {
        overflow-x: auto;
      }
      .md table {
        border-collapse: collapse;
        font-size: 14px;
      }
      .md th,
      .md td {
        border: 1px solid var(--line);
        padding: 4px 8px;
        vertical-align: top;
      }
      .md th {
        background: var(--mine);
      }
      .md a {
        color: var(--accent);
      }
      .msg.user {
        align-self: flex-end;
        background: var(--mine);
        border-radius: 14px;
        padding: 8px 12px;
        max-width: 85%;
      }
      .msg.error {
        color: var(--warn);
      }
      details {
        color: var(--dim);
        font-size: 14px;
        white-space: pre-wrap;
      }
      #empty {
        margin: auto;
        text-align: center;
        color: var(--dim);
        max-width: 28em;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 44px;
        max-height: 40dvh;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        font-size: 16px; /* 16px so a phone does not zoom on focus */
      }
      #send {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        min-width: 64px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Chat</h1>
      <select id="model" aria-label="Model"></select>
      <button id="new" type="button">New</button>
    </header>
    <div id="standing">Asking the lender's computer…</div>
    <main id="log">
      <p id="empty"></p>
    </main>
    <form id="ask">
      <textarea id="text" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <script type="module" src="page.js"></script>
  </body>
</html>

# The card svrngs-keeper ships for llama-server. `keep <port>` fills each
# @word@ from what the running llama-server reports (src/promote.rs
# `llama_card`): its /props `model_path` and
# `default_generation_settings.n_ctx`, and the address and port it listens on.
x-svrngs:
  title: @name@
  about: @about@
  door: { port: @port@, protocol: http }
  state: []
  native:
    command: [@program@, --model, @model@, --host, @host@, --port, @port@, --ctx-size, @ctx@]
    folder: @folder@

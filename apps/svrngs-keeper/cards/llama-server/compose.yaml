# The card svrngs-keeper suggests for llama-server. `facts <port>` fills in
# the model path from /props and the port. Review the command and add any flags.
x-svrngs:
  title: @name@
  about: @about@
  door: { port: @port@, protocol: http }
  state: []
  native:
    command: [llama-server, --model, @model@, --host, "127.0.0.1", --port, @port@]
    folder: @folder@

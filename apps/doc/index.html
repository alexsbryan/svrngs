<!-- ported from commonwealth-ai cmnwlth/apps/ring-doc/index.html@47b8acfd0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doc</title>
    <style>
      /* svrngs's look (crates/svrngs-node/src/home/look.css): the browser's
         own fonts and colours, plain rules, warmth by named colours read in
         black. Nothing imitates paper or a hand. */
      :root { color-scheme: light dark; --ink: CanvasText; --rule: 3px solid var(--ink); --hair: 1px solid var(--ink); --face: system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      [hidden] { display: none !important; }
      body { margin: 0; background: Canvas; color: CanvasText; font: 17px/1.45 var(--face); }
      main { max-width: 44rem; margin: 0 auto; padding: 0 1rem 4rem; }
      h1 { margin: 1rem 0 0.75rem; padding: 0.9rem 1rem 0.7rem; border: var(--rule); background: salmon; color: black; font-size: clamp(2rem, 9vw, 4rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.045em; overflow-wrap: anywhere; }
      .sub { margin: 0.25rem 0; }
      #here { font-family: var(--mono); font-size: 0.85rem; }
      .docwrap { position: relative; margin: 1rem 0; }
      #editor .tiptap { outline: none; min-height: 14rem; border: var(--rule); padding: 0.75rem 1rem; }
      #editor .tiptap:focus { border-color: royalblue; }
      #editor .tiptap > :first-child { margin-top: 0; }
      /* The caret extension sets only the COLOUR inline (app.js `caret`);
         position and label are the page's, and without them a cursor renders
         as a block that shoves the text it is pointing at out of the way. */
      .collaboration-carets__caret { position: relative; border-left: 2px solid; border-right: 0; margin: 0 -1px; word-break: normal; pointer-events: none; }
      .collaboration-carets__label { position: absolute; top: -1.4em; left: -2px; font-size: 0.72rem; font-weight: 700; line-height: 1.3; color: white; padding: 0 0.3em; white-space: nowrap; user-select: none; }
      /* The attribution gutter. Absolute against .docwrap so each note sits at
         its paragraph's offsetTop; below ~62rem the page is too narrow for a
         margin and the notes fall into the flow under the editor, in the same
         order. They are never hidden — an attribution nobody can see is the
         one thing this column is for. */
      #attribution .note { position: absolute; left: 100%; margin-left: 0.9rem; width: 10rem; font-size: 0.72rem; line-height: 1.35; }
      @media (max-width: 62rem) {
        #attribution { margin-top: 0.6rem; }
        #attribution .note { position: static; width: auto; margin-left: 0; }
      }
      .fine { font-size: 0.8rem; }
      /* Goodnight: the lender's computer is not answering. */
      #night { margin: 1rem 0; padding: 0.75rem 1rem 0.5rem; border: var(--rule); background: lavender; color: black; }
      #night h2 { margin: 0 0 0.4rem; font-size: 1.6rem; font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; }
      #night .moon { font-size: 2.4rem; vertical-align: -0.2rem; }
      #back { margin: 1rem 0; padding: 0.5rem 1rem; border: var(--rule); background: palegreen; color: black; }
      #err { color: tomato; }
      /* ?wall: the doc on a projector, read across a room. */
      body.wall main { max-width: none; padding: 0 3vw; }
      body.wall h1 { font-size: 6vw; }
      body.wall { font-size: 2.3vw; }
      body.wall #here { font-size: 1.6vw; }
      body.wall #editor .tiptap { min-height: 60vh; }
      body.wall .fine, body.wall #attribution { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Doc</h1>
      <p class="sub" id="you"></p>
      <p class="sub" id="here"></p>
      <section id="night" hidden role="status">
        <h2><span class="moon" aria-hidden="true">☾</span> <span id="night-title">Goodnight from this doc</span></h2>
        <p id="night-words"></p>
        <p id="kept"></p>
      </section>
      <p id="back" hidden role="status"></p>
      <div class="docwrap">
        <div id="editor"></div>
        <div id="attribution"></div>
      </div>
      <p class="fine">Each paragraph says who last edited it, by the name svrngs gave them as they opened this doc. Who typed each letter inside a paragraph isn’t shown: only each browser says that, and nothing checks it.</p>
      <p id="err"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>

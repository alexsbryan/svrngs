<!doctype html>

<!-- Magnets: a sentence of word magnets the group shares. Its script is index.js; what it draws and says, board.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnets</title>
<meta name="description" content="A fridge of word magnets your group shares. Add a word to the sentence.">
<link rel="stylesheet" href="style.css">
<script type="module" src="index.js"></script>
</head>
<body>
<main>
<h1>Magnets</h1>
<p id="said" role="status">Opening your group’s fridge…</p>
<div id="board" hidden>
<section aria-label="Your group’s sentence">
<p id="sentence" aria-live="polite" aria-atomic="true"><span id="prompt"></span><span id="placed"></span><span id="blank" aria-hidden="true">____</span></p>
<p class="hint">Anyone in your group can change it.</p>
<div id="play">
<p id="how" class="hint unseen">Tap a word in the sentence to move it or take it out.</p>
<p id="acts"><button id="send" type="button" class="unseen">Send it to your group</button> <button id="keep" type="button" class="unseen">Keep it and start a new one</button></p>
<p id="sent" role="status"></p>
</div>
</section>
<section id="pile" aria-labelledby="add">
<h2 id="add">Tap a word to add it</h2>
<ul id="tray" aria-labelledby="add"></ul>
</section>
<section id="before" aria-labelledby="before-heading" hidden>
<h2 id="before-heading">On the fridge before</h2>
<ul id="kept"></ul>
</section>
</div>
<!-- A word's moves, opened by the word in the sentence (index.js `choose`). -->
<div id="moves" popover>
<button id="out" type="button" autofocus></button>
<button id="earlier" type="button">Earlier</button>
<button id="later" type="button">Later</button>
</div>
</main>
</body>
</html>

<!doctype html>
<!-- ported from commonwealth-ai sovereign/apps/ring-runtime/web/index.html@e1a43bcd2 -->
<!--
  The page a group's link opens on a phone: `<origin>#<token>` (DESIGN §3,
  "Joining"). Static files any origin can serve — no server, no certificate,
  no data. The FRAGMENT carries the link's token, and a browser never sends
  the fragment to the origin, so the page loads from public static hosting
  while the link stays on the phone; `no-referrer` keeps it out of every
  Referer too.

  After first load the page needs no origin traffic at all (the service worker
  caches it), because it is an iroh endpoint: it dials the group's computers
  by key over a relay (web/src/lib.rs).

  The CSP is deliberately strict: no inline script (app.js is external), no
  remote code. `wasm-unsafe-eval` is required to instantiate WebAssembly;
  `connect-src` must allow the relay's WebSocket (wss://*.relay.n0.iroh.link
  by default, plus any self-hosted relay a link carries). Nothing here is
  allowed to phone a third party. Every word a person reads here is DESIGN
  §1's: the group, people's names, computer, phone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss: https:; img-src 'none'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Your group</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 1.5rem auto; max-width: 46rem; padding: 0 1rem; }
  h1 { font-size: 1.2rem; }
  #status { font-weight: 600; }
  pre { background: #8881; padding: .75rem; border-radius: .5rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .bad { color: #c22; }
  .good { color: #2a2; }
</style>
</head>
<body>
<h1 id="status">Opening…</h1>
<pre id="response"></pre>
<script type="module" src="./app.js?v=__VERSION__"></script>
</body>
</html>

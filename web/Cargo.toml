# ported from commonwealth-ai sovereign/apps/ring-runtime/Cargo.toml@e1a43bcd2
# The guest runtime — the page an iroh guest link opens.
#
# A Rust crate compiled to wasm: it IS an iroh endpoint (relay-only), so the
# page dials the wall by public key and speaks the rail over that stream. No
# HTTP door, no TLS termination, no proxy (docs/RING_APP_LIBRARY.md, "The page
# is an iroh endpoint").
#
# Standalone on purpose: `[workspace]` below keeps it out of the repo's
# workspace, which builds for the host. This crate only builds for
# wasm32-unknown-unknown, via scripts/build-web.sh.
[package]
name = "svrngs-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The browser dial was measured WORKED at these pins (Cargo.lock of the
# measuring build, browser-dial bd-1); iroh is bumped to the relay queue's
# version (relay-survey: demo/runs/relay-commons/SURVEY.md, "The chosen
# versions"), whose web probe resolves the same wasm-bindgen set.
# `unstable-custom-transports` is the WebRTC path's slot (webrtc-page; the
# node's own Cargo.toml).
iroh = { version = "=1.4.2", features = ["unstable-custom-transports"] }
# The wire's custom address and its datagram meta, as iroh's own traits
# spell them (webrtc-page; `crates/svrngs-node/src/webrtc/wire.rs` compiled
# here by `#[path]`): iroh-base and the two n0 crates iroh 1.4.2 resolves,
# the node's pins, so no new crate joins this lock.
iroh-base = "=1.4.2"
n0-watcher = "=1.0.0"
noq-udp = "=1.4.1"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
# svrngs-core in place of upstream's kernel-types (PLAN §4, U4's
# inventory): the one window this standalone workspace opens back into the
# tree, and it opens downward. svrngs-core is no_std, with no I/O.
svrngs-core = { path = "../crates/svrngs-core" }
# HTTP over the dial (u4-4): hyper's HTTP/1 client, runtime-agnostic, as the
# node's door is hyper's server; the page's streams as Rust streams, and
# back. Each at the version this crate's lock already held through iroh.
hyper = { version = "1.11", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1.5"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# `sync` is the wire's queue of arrived datagrams (webrtc-page), as the
# spike's page took it.
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-streams = "0.5"
web-sys = { version = "=0.3.105", features = ["Blob", "Headers", "MessageEvent", "MessagePort", "ReadableStream", "Response", "ResponseInit", "WritableStream"] }
thiserror = "2"
# Joining (u4-5): the ask's and the redemption's bodies as the node reads
# them, and a lender's key as the record spells it. The versions
# svrngs-core's lock already holds.
serde_json = "1"
hex = "0.4"
# A phone's set (set.rs): its changes and its form as svrngs-db writes
# them, postcard's bytes, carried in base64, each the version this
# crate's lock already holds through iroh, and serde to read a prepare.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
base64 = "0.22"
# The node's relay adapter, compiled here by `#[path]` (src/lib.rs, u4-9):
# the stream iroh's lookup answers with, and the adapter's traces. Each at
# the version this crate's lock already holds through iroh.
n0-future = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "registry"] }

# Its own workspace root: without this, cargo walks up to the repo's
# [workspace] and refuses the crate as a non-member.
[workspace]

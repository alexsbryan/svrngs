# ported from commonwealth-ai sovereign/apps/ring-runtime/Cargo.toml@e1a43bcd2
# The guest runtime — the page an iroh guest link opens.
#
# A Rust crate compiled to wasm: it IS an iroh endpoint (relay-only), so the
# page dials the wall by public key and speaks the rail over that stream. No
# HTTP door, no TLS termination, no proxy (docs/RING_APP_LIBRARY.md, "The page
# is an iroh endpoint").
#
# Standalone on purpose: `[workspace]` below keeps it out of the repo's
# workspace, which builds for the host. This crate only builds for
# wasm32-unknown-unknown, via scripts/build-web.sh.
[package]
name = "svrngs-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The LOCKED pin (Cargo.lock of the measuring build, browser-dial bd-1): the
# browser dial was measured WORKED at exactly these versions.
iroh = "=1.0.2"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
# svrngs-core in place of upstream's kernel-types (DESIGN §8, U4's
# inventory): the one window this standalone workspace opens back into the
# tree, and it opens downward. svrngs-core is no_std, with no I/O.
svrngs-core = { path = "../crates/svrngs-core" }
# HTTP over the dial (u4-4): hyper's HTTP/1 client, runtime-agnostic, as the
# node's door is hyper's server; the page's streams as Rust streams, and
# back. Each at the version this crate's lock already held through iroh.
hyper = { version = "1.11", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1.5"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
wasm-streams = "0.5"
web-sys = { version = "=0.3.105", features = ["Headers", "ReadableStream", "Response", "ResponseInit"] }
thiserror = "2"

# Its own workspace root: without this, cargo walks up to the repo's
# [workspace] and refuses the crate as a non-member.
[workspace]

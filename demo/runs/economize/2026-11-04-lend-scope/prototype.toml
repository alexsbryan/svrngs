[package]
name = "lend-scope-scratch"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "withdrawal"
path = "prototype.rs"

[dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
axum = "0.8"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
n0-future = "0.3"

[workspace]

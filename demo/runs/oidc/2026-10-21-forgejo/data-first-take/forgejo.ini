APP_NAME = Forgejo
RUN_USER = alexsbryan
RUN_MODE = prod
WORK_PATH = /tmp/oidc-forgejo/forgejo

[server]
PROTOCOL = http
DOMAIN = localhost
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 18097
ROOT_URL = http://localhost:18097/
DISABLE_SSH = true
START_SSH_SERVER = false
OFFLINE_MODE = true
LFS_START_SERVER = false
APP_DATA_PATH = /tmp/oidc-forgejo/forgejo/data

[database]
DB_TYPE = sqlite3
PATH = /tmp/oidc-forgejo/forgejo/data/forgejo.db

[repository]
ROOT = /tmp/oidc-forgejo/forgejo/data/repositories

[security]
INSTALL_LOCK = true
SECRET_KEY = <redacted>
INTERNAL_TOKEN = <redacted>

[service]
DISABLE_REGISTRATION = false
REGISTER_EMAIL_CONFIRM = false
REGISTER_MANUAL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false

[oauth2]
ENABLED = true

[oauth2_client]
ENABLE_AUTO_REGISTRATION = true
USERNAME = preferred_username
REGISTER_EMAIL_CONFIRM = false

[log]
MODE = console
LEVEL = Info

[session]
PROVIDER = file
PROVIDER_CONFIG = /tmp/oidc-forgejo/forgejo/data/sessions

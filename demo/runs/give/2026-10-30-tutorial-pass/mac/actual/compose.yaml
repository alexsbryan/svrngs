# Derived by hand from the process on 127.0.0.1:5006 (2026-10-30 tutorial pass):
# `node ~/.npm/_npx/ae37a5acd0f97261/node_modules/.bin/actual-server`, parent
# `npm exec @actual-app/sync-server` (i.e. `npx @actual-app/sync-server`), in
# /private/tmp/svrngs-pass/actual/work, which is its data: with no ./data and no
# config, actual-server makes the folder it runs in its data directory.
# HOME stands for the person's home: this run gave the program
# HOME=/private/tmp/svrngs-pass/actual/home.
services:
  app:
    # node 24.22.1, the full image: on slim, npm's install of better-sqlite3
    # runs node-gyp, which needs python3.
    image: docker.io/library/node:24.22.1@sha256:a217980f5435fcc8e8896361099faecb1c5d7f341cb7a213ff75e986d822473e
    command: ["node", "/private/tmp/svrngs-pass/actual/home/.npm/_npx/ae37a5acd0f97261/node_modules/.bin/actual-server"]
    working_dir: /private/tmp/svrngs-pass/actual/work
    volumes:
      - "code:/private/tmp/svrngs-pass/actual/work"
      - "code:/tmp/svrngs-pass/actual/work"
      # npm ci, in this image, from the npx folder's own package-lock.json.
      - "deps:/private/tmp/svrngs-pass/actual/home/.npm/_npx/ae37a5acd0f97261"
    ports: ["5006:5006/tcp"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5006/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      retries: 12
  # It listened on 127.0.0.1 alone, so the pod's door forwards to it.
  door:
    image: docker.io/alpine/socat@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287
    command: ["TCP-LISTEN:25006,fork,reuseaddr", "TCP:127.0.0.1:5006"]
    ports: ["25006:25006/tcp"]
volumes:
  code: {}
  deps: {}
x-svrngs:
  title: actual
  about: "npx @actual-app/sync-server, given by Alex's computer"
  door: { port: 25006, protocol: http }
  state: [code, deps]
  asks: []

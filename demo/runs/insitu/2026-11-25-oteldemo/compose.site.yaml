# The run's changes to OTel Demo 3.1.0's compose.yaml, and nothing else:
# the collector writes the site's file and publishes no port; it gets no
# host filesystem and no container socket; the proxy moves off 8080, which
# this computer already uses. The five services that bind-mount the demo's
# own files run without SELinux labelling, since the demo's compose mounts
# them unlabelled and Fedora refuses that ("permission denied").
services:
  otel-collector:
    command: ["--config=/etc/otelcol-config.yml", "--config=/etc/otelcol-site.yml", "--feature-gates=service.profilesSupport"]
    volumes:
      - ${HOST_FILESYSTEM}:/hostfs:ro
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro
      - ${OTEL_COLLECTOR_CONFIG}:/etc/otelcol-config.yml
      - ../../otelcol-site.yml:/etc/otelcol-site.yml:ro,Z
      - ../../out/site:/site:Z
    ports: !reset []
    security_opt: [label=disable]
  product-catalog:
    security_opt: [label=disable]
  flagd:
    security_opt: [label=disable]
  flagd-ui:
    security_opt: [label=disable]
  astronomy-db:
    image: docker.io/library/postgres:18.4   # the demo's short name, written out: podman can't prompt for it
    security_opt: [label=disable]
